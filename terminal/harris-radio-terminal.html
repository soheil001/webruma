<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harris LNM 3000 | ترمینال رادیو تعاملی</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#14161a}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px 0;font-family:Tahoma,system-ui,sans-serif;color:#aab1ba;-webkit-user-select:none;user-select:none}
.stage{position:relative;width:min(100vw,calc(100vh - 64px),1200px);aspect-ratio:1/1;container-type:inline-size}
.scene{position:absolute;inset:0;direction:ltr;--u:calc(100cqw / 1200);touch-action:manipulation}
.scene>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none}

/* ---------- LCD ---------- */
#lcd{--lcd:#c6c7c3;font-family:"DejaVu Sans Mono","Lucida Console",ui-monospace,Consolas,monospace;font-weight:600;color:#1b1d1c}
#lcd .glass{position:absolute;left:calc(var(--u)*314);top:calc(var(--u)*266);width:calc(var(--u)*362);height:calc(var(--u)*144);background:var(--lcd);box-shadow:inset 0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,0,0,.38);border-radius:calc(var(--u)*3);transition:background .2s}
#lcd .p{position:absolute;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));font-size:calc(var(--u)*17);line-height:1;white-space:pre}
#lcd .big{font-size:calc(var(--u)*37);letter-spacing:0}
#lcd .box{position:absolute;border:calc(var(--u)*2) solid #1b1d1c;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w));height:calc(var(--u)*var(--h))}
#lcd .fill{position:absolute;left:0;bottom:0;width:100%;background:#1b1d1c}
#lcd .hz{position:absolute;left:0;top:0;height:100%;background:#1b1d1c;transition:width .15s}
#lcd .inv{background:#1b1d1c;color:var(--lcd);padding:0 calc(var(--u)*2);margin:0 calc(var(--u)*-2)}
#lcd .dim{opacity:.22}
#lcd.off .t,#lcd.off .box>*{visibility:hidden}
#lcd.off .box{border-color:transparent}
#lcd.off{--lcd:#8c8e8a !important}

/* ---------- phone ---------- */
#phone{position:absolute;left:calc(var(--u)*879);top:calc(var(--u)*222);width:calc(var(--u)*237);height:calc(var(--u)*417);background:#cdd0cf;color:#2b2f33;font:calc(var(--u)*13)/1.45 Arial,Helvetica,sans-serif;padding:calc(var(--u)*9) calc(var(--u)*10);overflow:hidden;display:none;pointer-events:none}
#phone::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.28) 0 42%,rgba(0,0,0,.06) 42% 100%)}
#phone h4{margin:0 0 calc(var(--u)*8);font-size:calc(var(--u)*13);font-weight:700}
#phone table{border-collapse:collapse;width:100%}
#phone td{padding:0;vertical-align:top;color:#4a5056}
#phone td:first-child{width:46%}
#phone .cl{columns:2;font-size:calc(var(--u)*12);color:#4a5056}
#phone .cl div{white-space:nowrap}
#phone .cl b{color:#111}

/* ---------- hotspots ---------- */
#hot{position:absolute;inset:0}
.hs{position:absolute;margin:0;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;outline:0;transition:background .08s,box-shadow .08s,transform .08s}
.hs:hover{background:rgba(255,255,255,.07)}
.hs.down{background:rgba(0,0,0,.34);box-shadow:inset 0 calc(var(--u)*3) calc(var(--u)*7) rgba(0,0,0,.65);transform:scale(.975)}
.hs.on{box-shadow:0 0 calc(var(--u)*14) rgba(255,176,0,.75),inset 0 0 calc(var(--u)*10) rgba(255,176,0,.35)}
.hs.knob{cursor:grab}
.hs>i{display:none;position:absolute;left:2px;top:2px;font:normal 700 calc(var(--u)*11)/1 monospace;color:#7dff7d;text-shadow:0 0 2px #000;pointer-events:none;white-space:nowrap}
.debug .hs{outline:calc(var(--u)*2) dashed #7dff7d;background:rgba(125,255,125,.12)}
.debug .hs>i{display:block}
.tkw{position:absolute;pointer-events:none}
.tick{position:absolute;inset:0;transition:transform .08s}
.tick::before{content:"";position:absolute;left:50%;top:2%;width:calc(var(--u)*4);height:30%;margin-left:calc(var(--u)*-2);border-radius:calc(var(--u)*2);background:#ffb21a;opacity:.85}

.bar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:12.5px;padding:0 10px;text-align:center;line-height:1.7}
.bar button{font:inherit;color:#d4dae1;background:#23272d;border:1px solid #3a4048;border-radius:6px;padding:3px 12px;cursor:pointer}
.bar button[aria-pressed=true]{background:#3a5a2c;border-color:#6ec24d}
.bar kbd{font:inherit;background:#23272d;border:1px solid #3a4048;border-radius:4px;padding:0 5px}
#xy{direction:ltr;font-family:monospace;min-width:11ch;color:#7dff7d}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const NAMES=['ALPHACO','BRAVO','CHARLIE','DELTA','ECHO','FOXTROT','GOLF','HOTEL','INDIA','JULIET','KILO','LIMA','MIKE','NOVEMB','OSCAR','PAPA','QUEBEC','ROMEO','SIERRA','TANGO','UNIFORM','VICTOR','WHISKEY','XRAY'];
const BANDS=[{n:'30-88MHZ',a:30,b:88},{n:'108-174MHZ',a:108,b:174},{n:'225-400MHZ',a:225,b:400},{n:'400-512MHZ',a:400,b:512}];
const MODES=['MANUAL','CIPHER','HOP','CUE'];
const TXP=['5W','2W','1W','0.5W'], STEPS=[12.5,25], TOTS=['OFF','30S','60S'], DV=['AUTO','VOICE','DATA'];
const LCDC=['#a4a6a2','#b5b6b2','#c6c7c3','#d6d9d0','#e6ead9'];
const pad=(n,l=2)=>String(n).padStart(l,'0');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const S={on:true,vol:5,sql:0,bl:2,mode:0,ch:0,vfo:false,ab:0,band:1,step:0,txp:0,tot:0,dv:0,
  beep:true,vox:false,bw:true,tdr:false,lock:false,scan:false,tx:false,mon:false,lamp:false,func:false,
  menu:null,buf:'',flash:'',page:0,ta:0};
let freqs=[151.275,446.0];
const MEM=NAMES.map((_,i)=>150+i*0.25);
const snap=f=>clamp(Math.round(f*1000/STEPS[S.step])*STEPS[S.step]/1000,30,512);
const curFreq=()=>S.vfo?freqs[S.ab]:MEM[S.ch];

/* ---------- audio ---------- */
let ac=null,noise=null,ng=null;
function A(){ if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();} if(ac.state==='suspended')ac.resume(); return ac; }
function tone(f,d=.06,type='square',g=.04,force){
  if(!force&&!S.beep)return;
  try{const c=A(),o=c.createOscillator(),v=c.createGain(),t=c.currentTime;
    o.type=type;o.frequency.value=f;
    v.gain.setValueAtTime(Math.max(.0006,g*(S.vol/5)),t);
    v.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function staticOn(on){
  try{const c=A();
    if(on&&!noise){const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      noise=c.createBufferSource();noise.buffer=b;noise.loop=true;
      const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.4;
      ng=c.createGain();noise.connect(f);f.connect(ng);ng.connect(c.destination);noise.start();}
    if(ng)ng.gain.value=(on&&S.on)?(S.vol/9)*.12:0;
  }catch(e){}
}
function rattle(){for(let i=0;i<7;i++)setTimeout(()=>tone(2200+Math.random()*2200,.025,'triangle',.05,true),i*55+Math.random()*30);}

/* ---------- state helpers ---------- */
let ft=null;
function flash(m,ms=1100){S.flash=m;clearTimeout(ft);ft=setTimeout(()=>{S.flash='';render();},ms);render();}
function setVol(v){
  v=clamp(v,0,9);const was=S.on;S.vol=v;S.on=v>0;
  if(!S.on){S.menu=null;S.scan=false;S.tx=false;S.mon=false;S.buf='';S.func=false;staticOn(false);}
  else if(!was){tone(1200,.08,'square',.04,true);setTimeout(()=>tone(1600,.1,'square',.04,true),90);}
  staticOn(S.mon);render();
}
function nav(d){
  if(S.vfo){let f=freqs[S.ab]+d*STEPS[S.step]/1000;if(f>512)f=30;if(f<30)f=512;freqs[S.ab]=snap(f);}
  else S.ch=(S.ch+d+24)%24;
}
const cyc=(arr,key,d)=>{S[key]=(S[key]+d+arr.length)%arr.length;};
const onoff=v=>v?'ON':'OFF';
const MENU=[
  {n:'VOL', get:()=>String(S.vol), set:d=>{S.vol=clamp(S.vol+d,1,9);staticOn(S.mon);}},
  {n:'SQL', get:()=>String(S.sql), set:d=>{S.sql=clamp(S.sql+d,0,9);}},
  {n:'BEEP',get:()=>onoff(S.beep),  set:()=>{S.beep=!S.beep;}},
  {n:'LIGHT',get:()=>String(S.bl),  set:d=>{S.bl=clamp(S.bl+d,0,4);}},
  {n:'TXP', get:()=>TXP[S.txp],     set:d=>cyc(TXP,'txp',d)},
  {n:'STEP',get:()=>STEPS[S.step]+'K',set:d=>cyc(STEPS,'step',d)},
  {n:'TOT', get:()=>TOTS[S.tot],    set:d=>cyc(TOTS,'tot',d)},
  {n:'VOX', get:()=>onoff(S.vox),   set:()=>{S.vox=!S.vox;}},
  {n:'D/V', get:()=>DV[S.dv],       set:d=>cyc(DV,'dv',d)},
  {n:'BW',  get:()=>S.bw?'WIDE':'NARROW',set:()=>{S.bw=!S.bw;}}
];
const FN={'1':'STEP','2':'TXP','4':'VOX','5':'BW','6':'LIGHT','8':'BEEP','9':'TOT','0':'SQL'};
function fn(k){
  if(k==='3'){MEM[S.ch]=curFreq();flash('SAVED CH'+pad(S.ch+1));return;}
  if(k==='7'){S.tdr=!S.tdr;flash('TDR '+onoff(S.tdr));return;}
  const it=MENU.find(m=>m.n===FN[k]);it.set(1);flash(it.n+' '+it.get());
}
let bt=null;
function commit(){
  clearTimeout(bt);const n=parseInt(S.buf,10);S.buf='';if(isNaN(n)){render();return;}
  if(S.vfo){if(n>=30&&n<=512)freqs[S.ab]=snap(n);else flash('RANGE');}
  else{if(n>=1&&n<=24)S.ch=n-1;else flash('INVALID');}
  render();
}

/* ---------- key logic ---------- */
function press(k){
  if(!S.on)return;
  if(S.lock&&k!=='#'){flash('LOCKED');tone(250,.12,'square',.05,true);return;}
  tone(/^\d$/.test(k)?600+(+k)*70:/^[#*]$/.test(k)?1100:900,.05);
  if(k==='F'){S.func=!S.func;render();return;}
  if(S.func){S.func=false;if(/^\d$/.test(k)&&!S.menu){fn(k);return;}}
  if(/^\d$/.test(k)){
    if(S.menu)return;
    S.buf=(S.buf+k).slice(0,3);clearTimeout(bt);
    if((!S.vfo&&S.buf.length>=2)||S.buf.length>=3)commit();else{bt=setTimeout(commit,1500);render();}
    return;
  }
  switch(k){
    case '*':S.scan=!S.scan;flash(S.scan?'SCAN ON':'SCAN OFF');break;
    case '#':S.lock=!S.lock;flash(S.lock?'LOCKED':'UNLOCKED');break;
    case 'MENU':
      if(S.buf){commit();break;}
      if(!S.menu)S.menu={i:0,edit:false};else S.menu.edit=!S.menu.edit;
      render();break;
    case 'EXIT':S.buf='';S.menu=null;S.scan=false;S.func=false;clearTimeout(bt);render();break;
    case 'UP':case 'DOWN':{
      const d=k==='UP'?1:-1;
      if(S.menu){if(S.menu.edit)MENU[S.menu.i].set(d);else S.menu.i=(S.menu.i+d+MENU.length)%MENU.length;}
      else nav(d);
      render();break;}
    case 'VFO':S.vfo=!S.vfo;flash(S.vfo?'VFO':'MEMORY');break;
    case 'AB':S.ab^=1;flash('VFO '+(S.ab?'B':'A'));break;
    case 'BAND':{
      S.band=(S.band+1)%BANDS.length;const b=BANDS[S.band];
      if(S.vfo)freqs[S.ab]=snap(Math.round((b.a+b.b)/2));
      flash(b.n);break;}
  }
}
function pttDown(){if(!S.on||S.tx)return;S.tx=true;tone(880,.1,'sine',.05,true);render();}
function pttUp(){if(!S.tx)return;S.tx=false;tone(1500,.09,'sine',.05,true);setTimeout(()=>tone(1100,.09,'sine',.05,true),110);render();}
function monDown(){if(!S.on)return;S.mon=true;staticOn(true);render();}
function monUp(){S.mon=false;staticOn(false);render();}
function lamp(){if(!S.on)return;S.lamp=!S.lamp;flash(S.lamp?'LAMP ON':'LAMP OFF');}
function cipher(){if(!S.on)return;S.mode=S.mode===1?0:1;flash(MODES[S.mode]);tone(700,.08);}

/* ---------- hotspots ---------- */
const hot=$('#hot'),ELS={};
const pos=(el,x,y,w,h)=>{el.style.left=x/12+'%';el.style.top=y/12+'%';el.style.width=w/12+'%';el.style.height=h/12+'%';};
function hs(o){
  const e=document.createElement('button');e.type='button';e.tabIndex=-1;
  e.className='hs'+(o.knob?' knob':'');e.title=o.tip||o.id;e.setAttribute('aria-label',o.tip||o.id);
  pos(e,o.x,o.y,o.w,o.h);e.style.borderRadius=o.r||'6px';
  const i=document.createElement('i');i.textContent=o.id+' '+o.x+','+o.y+' '+o.w+'x'+o.h;e.appendChild(i);
  hot.appendChild(e);ELS[o.id]=e;return e;
}
const release=(e,fn)=>['pointerup','pointerleave','pointercancel'].forEach(t=>e.addEventListener(t,()=>{if(e.classList.contains('down')){e.classList.remove('down');fn&&fn();}}));
function bindKey(e,k){
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.classList.add('down');press(k);});
  release(e);
}
function bindHold(e,down,up){
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.setPointerCapture&&e.setPointerCapture(ev.pointerId);e.classList.add('down');down();});
  release(e,up);
}
function bindTap(e,fn,right){
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.classList.add('down');fn(ev);});
  release(e);
  if(right)e.addEventListener('contextmenu',ev=>{ev.preventDefault();right();});
}
const ticks=[];
function knob(o,step,ang,tk,sy=1){
  const e=hs({...o,knob:true,r:'50%'});
  const w=document.createElement('div');w.className='tkw';pos(w,tk[0]-tk[2]/2,tk[1]-tk[2]/2,tk[2],tk[2]);
  w.style.transform='scaleY('+sy+')';w.innerHTML='<div class="tick"></div>';hot.appendChild(w);
  ticks.push({el:w.firstChild,ang});
  let sa=0,acc=0,tot=0,down=false;
  const a=ev=>{const r=w.getBoundingClientRect();return Math.atan2(ev.clientY-(r.top+r.height/2),ev.clientX-(r.left+r.width/2))*180/Math.PI;};
  const st=d=>{step(d);tone(500,.03);render();};
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);down=true;e.classList.add('down');sa=a(ev);acc=0;tot=0;});
  e.addEventListener('pointermove',ev=>{if(!down)return;const n=a(ev);let d=n-sa;if(d>180)d-=360;if(d<-180)d+=360;sa=n;acc+=d;tot+=Math.abs(d);
    while(Math.abs(acc)>=22){const s=Math.sign(acc);acc-=s*22;st(s);}});
  const end=ev=>{if(!down)return;down=false;e.classList.remove('down');if(tot<5&&ev.type==='pointerup')st(1);};
  e.addEventListener('pointerup',end);e.addEventListener('pointercancel',end);
  e.addEventListener('wheel',ev=>{ev.preventDefault();st(ev.deltaY<0?1:-1);},{passive:false});
  e.addEventListener('contextmenu',ev=>{ev.preventDefault();st(-1);});
  return e;
}

/* keypad */
const COLS=[396,465,533,601];
[['1','2','3','*'],['4','5','6','0'],['7','8','9','#']].forEach((row,r)=>row.forEach((k,c)=>{
  bindKey(hs({id:'key'+k,x:COLS[c],y:[700,743,785][r],w:59,h:35,tip:k}),k);
}));
[['MENU',0],['UP',1],['DOWN',2],['EXIT',3]].forEach(([k,c])=>bindKey(hs({id:k,x:COLS[c],y:657,w:59,h:33,tip:k}),k));
bindKey(hs({id:'VFO/MR',x:303,y:507,w:58,h:62,tip:'VFO/MR'}),'VFO');
bindKey(hs({id:'A/B',x:380,y:612,w:58,h:26,tip:'A/B'}),'AB');
bindKey(hs({id:'BAND',x:618,y:612,w:58,h:26,tip:'BAND'}),'BAND');
bindKey(hs({id:'FUNC',x:581,y:612,w:24,h:24,r:'4px',tip:'FUNC'}),'F');
bindKey(hs({id:'MULTIBAND',x:380,y:840,w:292,h:32,tip:'MULTIBAND'}),'BAND');

/* caution cover, lever, side keys */
bindTap(hs({id:'CAUTION',x:372,y:518,w:98,h:74,tip:'CIPHER'}),cipher);
bindTap(hs({id:'LEVER',x:695,y:505,w:28,h:158,r:'8px',tip:'LAMP'}),lamp);
bindHold(hs({id:'PTT',x:768,y:298,w:40,h:122,r:'18px',tip:'PTT'}),pttDown,pttUp);
bindHold(hs({id:'MON',x:727,y:316,w:30,h:68,r:'6px',tip:'MONITOR'}),monDown,monUp);
bindHold(hs({id:'MIC',x:133,y:875,w:62,h:205,r:'12px',tip:'PTT (mic)'}),pttDown,pttUp);
bindTap(hs({id:'SPEAKER',x:685,y:908,w:145,h:145,r:'50%',tip:'SPEAKER'}),()=>{if(S.on){tone(1000,.25,'sine',.06,true);flash('TEST');}});

/* knobs */
knob({id:'VOL',x:414,y:80,w:80,h:112,tip:'VOLUME / POWER'},d=>setVol(S.vol+d),()=>-135+S.vol/9*270,[453,106,62],.55);
knob({id:'MODE',x:512,y:80,w:80,h:112,tip:'MODE'},d=>{if(!S.on)return;cyc(MODES,'mode',d);flash(MODES[S.mode]);},()=>-135+S.mode/3*270,[551,106,62],.55);
knob({id:'SQL',x:538,y:505,w:44,h:44,tip:'SQUELCH'},d=>{if(!S.on)return;S.sql=clamp(S.sql+d,0,9);flash('SQL '+S.sql);},()=>-135+S.sql/9*270,[560,527,34]);
knob({id:'LIGHT',x:538,y:559,w:44,h:44,tip:'BACKLIGHT'},d=>{if(!S.on)return;S.bl=clamp(S.bl+d,0,4);flash('LIGHT '+S.bl);},()=>-135+S.bl/4*270,[560,581,34]);
knob({id:'TUNE',x:584,y:507,w:92,h:92,tip:'TUNE'},d=>{if(!S.on)return;S.ta+=d*20;nav(d);},()=>S.ta,[630,553,74]);

/* phone + pills */
const phoneEl=$('#phone');
bindTap(hs({id:'PHONE',x:876,y:215,w:242,h:428,r:'8px',tip:'GENERAL INFORMATION'}),()=>{S.page=(S.page+1)%4;tone(1400,.04,'sine',.04,true);render();},()=>{S.page=(S.page+3)%4;render();});
bindTap(hs({id:'PILLS1',x:1032,y:735,w:168,h:140,r:'24px',tip:'pills'}),rattle);
bindTap(hs({id:'PILLS2',x:1032,y:880,w:168,h:150,r:'24px',tip:'pills'}),rattle);

/* ---------- render ---------- */
const T=(id,v)=>{const e=document.getElementById(id);if(e.textContent!==v)e.textContent=v;return e;};
function bigText(){
  if(S.flash)return S.flash;
  if(S.buf)return S.buf+'_';
  if(S.menu){const m=MENU[S.menu.i];return S.menu.edit?m.n+' '+m.get():pad(S.menu.i+1)+'-'+m.n;}
  return S.vfo?curFreq().toFixed(3)+'MHZ':pad(S.ch+1)+'-'+NAMES[S.ch];
}
const rnd=()=>1+Math.floor(Math.random()*9);
function render(){
  const L=$('#lcd');L.classList.toggle('off',!S.on);
  L.style.setProperty('--lcd',LCDC[S.lamp?4:S.bl]);
  T('rb',(S.tx?'T':'R')+' BAT');
  T('f1',S.func?'FUN':'FIH');
  $('#f2').classList.toggle('dim',S.mon);
  const p3=$('#f3');p3.classList.toggle('inv',S.tx);
  T('sm',(S.mon||S.scan)?'S'+rnd()+rnd()+rnd()+'+':'S369+');
  T('md',S.menu?'MENU':MODES[S.mode]+(S.ab?' B':''));
  T('big',bigText());
  T('vx',S.vox?'VOX':'OFF');
  T('me',S.vfo?'VFO':'ME24');
  T('sc',S.scan?'SCAN':S.tdr?'TDR':'-----');
  T('sq',pad(S.sql,3));
  const d=new Date();T('ck',pad(d.getHours())+':'+pad(d.getMinutes()));
  $('#dt').classList.toggle('inv',S.dv===2);$('#vc').classList.toggle('inv',S.dv===1);
  T('lk',S.lock?'LOCK':'HEY');
  T('bw',S.bw?'CHAM':'NARR');
  $('#hz').style.width=(S.tx?100:S.mon?30+Math.random()*70:S.vol/9*100)+'%';
  ticks.forEach(t=>{t.el.style.transform='rotate('+t.ang()+'deg)';});
  ELS.CAUTION.classList.toggle('on',S.mode===1&&S.on);
  ELS.LEVER.classList.toggle('on',S.lamp);
  ELS.FUNC.classList.toggle('on',S.func);
  renderPhone();
}
function renderPhone(){
  if(S.page===0){phoneEl.style.display='none';return;}
  phoneEl.style.display='block';
  const f=curFreq(),b=BANDS[S.band];let h='';
  if(S.page===1){
    h='<h4>Harris AN/PRC-152 RADIO STATUS</h4><table>'+[
      ['Channel',pad(S.ch+1)+'-'+NAMES[S.ch]],['Frequency',f.toFixed(4)+' MHz'],['Mode',MODES[S.mode]+(S.vfo?' / VFO '+(S.ab?'B':'A'):' / MEM')],
      ['Volume',S.vol+' / 9'],['Squelch',S.sql],['Tx power',TXP[S.txp]],['Step',STEPS[S.step]+' kHz'],
      ['Bandwidth',S.bw?'Wide':'Narrow'],['VOX',onoff(S.vox)],['Beep',onoff(S.beep)],['Timeout',TOTS[S.tot]],
      ['Band',b.n.replace('MHZ',' MHz')],['Scan',onoff(S.scan)],['Keypad',S.lock?'Locked':'Unlocked'],['PTT',S.tx?'TRANSMIT':'Receive']
    ].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';
  }else if(S.page===2){
    h='<h4>CHANNEL LIST</h4><div class="cl">'+NAMES.map((n,i)=>{
      const s=pad(i+1)+' '+n,t=MEM[i].toFixed(3);
      return '<div>'+(i===S.ch&&!S.vfo?'<b>'+s+'</b>':s)+'</div><div style="color:#6b7279;font-size:.85em;margin-bottom:2px">'+t+'</div>';
    }).join('')+'</div>';
  }else{
    h='<h4>KEYPAD GUIDE</h4><table>'+[
      ['F + 1','Step'],['F + 2','Tx power'],['F + 3','Save to channel'],['F + 4','VOX'],['F + 5','Bandwidth'],['F + 6','Backlight'],
      ['F + 7','Dual watch'],['F + 8','Beep'],['F + 9','Timeout'],['F + 0','Squelch'],['*','Scan'],['#','Key lock'],
      ['MENU','Open / edit item'],['Up / Down','Channel or frequency'],['Exit','Back']
    ].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';
  }
  if(phoneEl.dataset.k!==h){phoneEl.innerHTML=h;phoneEl.dataset.k=h;}
}

/* ---------- keyboard, debug, timers ---------- */
function blink(id){const e=ELS[id];if(!e)return;e.classList.add('down');setTimeout(()=>e.classList.remove('down'),130);}
const KM={'*':'*','#':'#',ArrowUp:'UP',ArrowDown:'DOWN',Enter:'MENU',Escape:'EXIT',f:'F',F:'F',v:'VFO',a:'AB',b:'BAND'};
const KID={'*':'key*','#':'key#',UP:'UP',DOWN:'DOWN',MENU:'MENU',EXIT:'EXIT',F:'FUNC',VFO:'VFO/MR',AB:'A/B',BAND:'BAND'};
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k===' '){e.preventDefault();if(!e.repeat){pttDown();ELS.PTT.classList.add('down');}return;}
  if(e.repeat&&!/^Arrow/.test(k))return;
  if(k==='m'||k==='M'){monDown();ELS.MON.classList.add('down');return;}
  if(k==='l'||k==='L'){lamp();return;}
  if(k==='h'||k==='H'){dbg();return;}
  if(k==='+'||k==='='){setVol(S.vol+1);return;}
  if(k==='-'){setVol(S.vol-1);return;}
  if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();if(S.on){const d=k==='ArrowRight'?1:-1;S.ta+=d*20;nav(d);render();}return;}
  let m=null;if(/^\d$/.test(k))m=k;else if(KM[k])m=KM[k];
  if(m){e.preventDefault();press(m);blink(/^\d$/.test(m)?'key'+m:KID[m]);}
});
addEventListener('keyup',e=>{
  if(e.key===' '){pttUp();ELS.PTT.classList.remove('down');}
  if(e.key==='m'||e.key==='M'){monUp();ELS.MON.classList.remove('down');}
});
const dbgBtn=$('#dbg');
function dbg(){const on=document.body.classList.toggle('debug');dbgBtn.setAttribute('aria-pressed',on);}
dbgBtn.addEventListener('click',dbg);
$('#scene').addEventListener('pointermove',e=>{
  const r=$('#scene').getBoundingClientRect(),k=1200/r.width;
  $('#xy').textContent='x:'+Math.round((e.clientX-r.left)*k)+' y:'+Math.round((e.clientY-r.top)*k);
});
$('#scene').addEventListener('contextmenu',e=>e.preventDefault());
setInterval(()=>{if(S.on&&S.scan&&!S.tx){nav(1);}if(S.on&&(S.mon||S.scan||S.tx))render();},380);
setInterval(render,1000);
render();
})();
</script>
