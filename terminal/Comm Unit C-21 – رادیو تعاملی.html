st.style.backgroundImage=`url(${IMG})`;

addEventListener('resize',fit);fit();

// ---------- state ----------
const S={on:1,spk:1,vol:60,sql:3,ch:1,step:.025,ab:0,f:[145.2,433.5],enc:1,lock:0,dim:2,lamp:0,page:0,tx:0,scan:0,msg:6,wx:0,mem:{},flash:'',ft:0,buf:'',bat:88,wave:[],rep:0,rxo:0};
const STEPS=[.025,.1,1,5],DIM=[.55,.8,1];
const fq=()=>S.f[S.ab];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const setF=v=>{S.f[S.ab]=Math.round(clamp(v,30,512)*1000)/1000};
const flash=t=>{S.flash=t;S.ft=performance.now()+1400};

// ---------- audio ----------
let AC,master,noiseG;
function ac(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);
 const b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const n=AC.createBufferSource();n.buffer=b;n.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;noiseG=AC.createGain();noiseG.gain.value=0;n.connect(f);f.connect(noiseG);noiseG.connect(master);n.start()}
const vol=()=>S.on&&S.spk?Math.pow(S.vol/100,2):0;
function beep(fr=1300,d=.05,v=.25){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=fr;o.type='square';g.gain.value=v*vol();o.connect(g);g.connect(master);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02)}
let txo;
function txTone(on){if(!AC)return;if(on&&!txo){txo=AC.createOscillator();const g=AC.createGain();g.gain.value=.15*vol();txo.frequency.value=900;txo.connect(g);g.connect(master);txo.start();txo._g=g}
 else if(!on&&txo){txo.stop();txo=null}}

// ---------- actions ----------
function power(v){S.on=v===undefined?!S.on:v;if(!S.on){S.scan=0;S.tx=0;txTone(0)}else flash('POWER ON');sync()}
const A={
 TX:{dn(){if(!S.on||S.lock)return;S.tx=1;txTone(1)},up(){S.tx=0;txTone(0)}},
 SCAN(){S.scan=!S.scan;flash(S.scan?'SCANNING...':'SCAN OFF')},
 MEM(){S.mem[S.ch]=[S.ab,fq()];flash('MEM STORED CH'+String(S.ch).padStart(2,'0'))},
 FNC(){S.page=(S.page+1)%4;flash(['LINK','SIGNAL','SETTINGS','CLOCK'][S.page])},
 'CH+'(){chg(1)},'CH-'(){chg(-1)},
 MHz(){const i=(STEPS.indexOf(S.step)+1)%4;S.step=STEPS[i];flash('STEP '+S.step+' MHz')},
 'A/B'(){S.ab^=1;flash('VFO '+'AB'[S.ab])},
 SQL(){S.sql=(S.sql+1)%10;flash('SQL '+S.sql)},
 ENC(){S.enc=!S.enc;flash(S.enc?'ENCRYPT ON':'ENCRYPT OFF')},
 DIM(){S.dim=(S.dim+1)%3;flash('DIM '+(S.dim+1)+'/3')},
 LMP(){S.lamp=!S.lamp;flash(S.lamp?'LAMP ON':'LAMP OFF')},
 PWR(){power()},
 WX(){const w=[162.4,162.425,162.45,162.475,162.5,162.525,162.55];setF(w[S.wx++%7]);flash('WX CH'+S.wx)},
 RES(){Object.assign(S,{sql:3,ch:1,step:.025,enc:1,lock:0,dim:2,lamp:0,page:0,scan:0,msg:6,mem:{}});S.f=[145.2,433.5];S.ab=0;flash('RESET')},
 ENT(){if(S.buf){const v=parseFloat(S.buf);if(v>=30&&v<=512){setF(v);flash('SET '+v.toFixed(3))}else flash('OUT OF RANGE');S.buf=''}else flash('ENTER')}
};
function chg(d){S.ch=(S.ch-1+d+16)%16+1;const m=S.mem[S.ch];if(m){S.ab=m[0];S.f[S.ab]=m[1]}flash('CH '+String(S.ch).padStart(2,'0')+(m?' MEM':''))}

// ---------- keypad ----------
const keys=[['TX','SCAN','MEM','FNC'],['CH+','CH-','MHz','A/B'],['SQL','ENC','DIM','LMP'],['PWR','WX','RES','ENT']];
const KX=[391,452,513,573],KY=[745,803,862,921],kel={};
keys.forEach((r,i)=>r.forEach((n,j)=>{
 const e=$('div','h k',{left:KX[j]-23+'px',top:KY[i]-23+'px',width:'46px',height:'46px'});kel[n]=e;
 const a=A[n];
 e.onpointerdown=ev=>{ac();e.setPointerCapture(ev.pointerId);if(!S.on&&n!=='PWR')return;if(S.lock&&n!=='PWR'){flash('KEY LOCK');beep(300,.1);return}beep();
  if(a.dn)a.dn();else a()};
 e.onpointerup=()=>{if(a.up)a.up()};e.onpointercancel=e.onpointerup;
}));

// ---------- knobs ----------
function knob(cx,cy,r,init,step,minA,maxA){
 const e=$('div','kn',{left:cx-r+'px',top:cy-r+'px',width:2*r+'px',height:2*r+'px',backgroundImage:`url(${IMG})`,backgroundPosition:`${-(cx-r)}px ${-(cy-r)}px`});
 e.a=init;const set=a=>{if(maxA!==undefined)a=clamp(a,minA,maxA);e.a=a;e.style.transform=`rotate(${a}deg)`};set(init);
 let last=null,acc=0;const ang=ev=>{const b=e.getBoundingClientRect();return Math.atan2(ev.clientY-(b.top+b.height/2),ev.clientX-(b.left+b.width/2))*180/Math.PI};
 const move=d=>{set(e.a+d);acc+=d;while(Math.abs(acc)>=step){const s=Math.sign(acc);acc-=s*step;e.cb(s)}};
 e.onpointerdown=ev=>{ac();e.setPointerCapture(ev.pointerId);last=ang(ev)};
 e.onpointermove=ev=>{if(last===null)return;const a=ang(ev);let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;move(d)};
 e.onpointerup=e.onpointercancel=()=>last=null;
 e.onwheel=ev=>{ev.preventDefault();ac();move(-Math.sign(ev.deltaY)*step)};
 return e}
const kVol=knob(448,650,40,(S.vol/100)*270-135,10,-135,135);
kVol.cb=s=>{if(!S.on)return;S.vol=clamp(Math.round((kVol.a+135)/270*100),0,100);flash('VOL '+S.vol);beep(1000,.04)};
const kCh=knob(570,650,40,0,24);kCh.cb=s=>{if(!S.on)return;chg(s);beep(1500,.03)};
const kFq=knob(259,663,60,0,18);kFq.cb=s=>{if(!S.on||S.lock)return;setF(fq()+s*S.step);beep(800,.02,.12)};

// ---------- switches ----------
const slot=$('div','slot',{});
const lv={};
[['pwr',10],['spk',150]].forEach(([n,y])=>{const l=$('div','lev',{top:y+'px'},slot);lv[n]=l});
slot.onpointerdown=ev=>{ac();const y=ev.clientY-slot.getBoundingClientRect().top,k=y<116*(slot.getBoundingClientRect().height/232)?'pwr':'spk';
 if(k==='pwr')power();else{S.spk=!S.spk;flash(S.spk?'SPEAKER ON':'SPEAKER OFF')}beep(700,.05);sync()};

// ---------- LEDs ----------
const L=[[372,620,'#ffc83a'],[372,646,'#58ff6a'],[372,673,'#58ff6a'],[575,215,'#4dff5d']].map(([x,y,c],i)=>{const e=$('div','led',{left:x-10+'px',top:y-10+'px',background:c,boxShadow:`0 0 12px 4px ${c}`});return e});
function sync(){const lit=(e,v)=>{e.style.opacity=v?1:0};
 lit(L[0],S.on&&(S.scan||S.tx||S.lock));lit(L[1],S.on);lit(L[2],S.on&&S.lamp);lit(L[3],S.on&&(S.rxo||S.tx));
 lv.pwr.style.top=(S.on?10:56)+'px';lv.spk.style.top=(S.spk?150:104)+'px'
 ;kel.ENC.classList.toggle('lit',!!S.enc&&!!S.on);kel.SCAN.classList.toggle('lit',!!S.scan);kel.LMP.classList.toggle('lit',!!S.lamp)}

// ---------- display ----------
const SK=[[232,300,'SECURE'],[305,392,'LOCK'],[398,482,'MSG'],[487,558,'REPLAY']];
scr.onpointerdown=ev=>{ac();if(!S.on)return;const b=scr.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width*352+218,y=(ev.clientY-b.top)/b.height*198+322;
 if(y>490){const i=SK.findIndex(k=>x>=k[0]&&x<=k[1]);beep();
  if(i===0)A.ENC();if(i===1){S.lock=!S.lock;flash(S.lock?'KEYPAD LOCKED':'UNLOCKED')}
  if(i===2){S.msg=S.msg%9+1;flash('MSG '+String(S.msg).padStart(2,'0')+' READ')}
  if(i===3){S.rep=performance.now()+3000;flash('REPLAY')}}};
let W=[],scanHold=0,rxLvl=0,t0=performance.now();
function draw(t){
 const Z=2,c=cv,w=704,h=396;c.setTransform(Z,0,0,Z,0,0);
 // screen offsets: local coords = image coords - (218,322)
 const dimf=S.on?DIM[S.dim]*(S.lamp?1.15:1):0;
 if(!S.on){c.fillStyle='#17130a';c.fillRect(0,0,352,198);return}
 let g=c.createLinearGradient(0,0,0,198);g.addColorStop(0,'#f6b62a');g.addColorStop(1,'#e6980e');c.fillStyle=g;c.fillRect(0,0,352,198);
 c.fillStyle='#4a3b12';c.fillRect(0,0,352,26);
 const tx=(s,x,y,sz,col,al='left')=>{c.font=`bold ${sz}px "Courier New",monospace`;c.fillStyle=col;c.textAlign=al;c.textBaseline='middle';c.fillText(s,x,y)};
 const am='#f2b227',br='#3a2a08';
 tx('Le000@U7B-01',8,13,12,am);
 // signal bars
 const sig=S.tx?5:Math.round(rxLvl*5);
 for(let i=0;i<5;i++){c.fillStyle=i<sig?am:'#7b6220';c.fillRect(228+i*5,20-(i+1)*3,3,(i+1)*3)}
 tx(Math.round(S.bat)+'%',290,13,12,am,'right');
 c.strokeStyle=am;c.strokeRect(296,7,24,12);c.fillStyle=am;c.fillRect(298,9,Math.round(20*S.bat/100),8);c.fillRect(320,10,2,6);
 // main line
 const ab='AB'[S.ab];
 const pg=S.page,fl=performance.now()<S.ft;
 let l1,tag;
 if(S.buf){l1='ENTER:'+S.buf+(t%800<400?'_':'');tag=''}
 else if(fl){l1=S.flash;tag=''}
 else if(pg===1){l1='RSSI:'+(S.tx?'TX ':Math.round(rxLvl*100)+'%');tag=''}
 else if(pg===2){l1=`SQL${S.sql} STP${S.step} CH${S.ch}`;tag=''}
 else if(pg===3){const d=new Date();l1='TIME '+d.toTimeString().slice(0,8);tag=''}
 else{l1='LINK:'+fq().toFixed(3)+' Mhz';tag=S.tx?'[TX]':S.scan?'[SCAN]':rxLvl>0.2?'[RX]':'[STABLE]'}
 tx(l1,6,41,l1.length>20?14:19,br);
 if(tag)tx(tag,346,48,10,'#2a5a2a','right');
 tx('VFO '+ab+' CH'+String(S.ch).padStart(2,'0'),6,60,8,'#6b4d10');
 // photo box
 c.fillStyle='#c8841a';c.fillRect(6,70,100,86);
 c.save();c.beginPath();c.rect(10,74,92,78);c.clip();
 if(photo.complete)c.drawImage(photo,246,402,62,76,26,74,64,78);
 c.restore();
 if(S.enc){c.fillStyle='#2a5a2a';c.fillRect(10,140,26,12);tx('ENC',23,146,8,'#f6d070','center')}
 // waveform box
 c.fillStyle='#e0a018';c.fillRect(115,76,232,82);c.strokeStyle=br;c.lineWidth=1.5;c.strokeRect(115,76,232,82);
 const active=S.tx||rxLvl>0.15||t<S.rep;
 if(!W.length)W=new Array(116).fill(0);
 if(t-(W._t||0)>50){W._t=t;W.shift();W.push((active?(.25+Math.random()*.75)*(t<S.rep?.9:1):Math.random()*.06))}
 W.forEach((a,i)=>{const hh=a*34,x=118+i*2;c.fillStyle=br;c.fillRect(x,117-hh,1.5,hh*2);
  if(i%5===0){c.fillStyle='#b8322a';c.fillRect(x,117-hh*.6,1.5,hh*1.2)}if(i%7===0){c.fillStyle='#2e8a3a';c.fillRect(x,117-hh*.4,1.5,hh*.8)}});
 // progress
 const p=t<S.rep?1-(S.rep-t)/3000:(rxLvl||0);
 c.fillStyle='#9a6a10';c.fillRect(115,162,232,6);c.fillStyle=br;c.fillRect(115,162,232*clamp(p,0,1),6);
 // soft keys
 c.fillStyle='#4a3b12';c.fillRect(0,172,352,26);
 SK.forEach(([a,b,n],i)=>{const x=a-218,wd=b-a;const on=(i===0&&S.enc)||(i===1&&S.lock);
  if(on){c.fillStyle='#f2b227';c.fillRect(x,174,wd,22)}
  tx(i===2?'MSG':n,x+(i===2?24:wd/2),185,11,on?br:am,i===2?'left':'center');
  if(i===2)tx(String(S.msg).padStart(2,'0'),x+wd-6,185,11,'#58ff6a','right')});
 // dimming / scanlines
 c.fillStyle=`rgba(0,0,0,${1-dimf>0?1-Math.min(1,dimf):0})`;c.fillRect(0,0,352,198);
 c.fillStyle='rgba(0,0,0,.07)';for(let y=0;y<198;y+=3)c.fillRect(0,y,352,1);
}
// ---------- loop ----------
let sc=0;
function loop(now){
 if(S.on){
  if(S.scan&&now>scanHold){S.f[S.ab]=Math.round((fq()+.025>148?144:fq()+.025)*1000)/1000;
   if(Math.random()<.012){scanHold=now+1500;rxTarget=.7+Math.random()*.3}else scanHold=now+25}
  if(!S.scan&&Math.random()<.01)rxTarget=Math.random()<.5?Math.random():0;
  if(S.tx)rxTarget=0;
  S.bat=Math.max(5,S.bat-.00004);
 }else rxTarget=0;
 rxLvl+=(rxTarget-rxLvl)*.08;
 S.rxo=S.on&&rxLvl*10>S.sql;
 if(AC&&noiseG)noiseG.gain.setTargetAtTime(S.rxo&&!S.tx?rxLvl*.18*vol():0,AC.currentTime,.05);
 if(AC&&master)master.gain.value=1;
 const f=Math.round(now/200);if(f!==sc){sc=f;sync()}
 draw(now);requestAnimationFrame(loop)}
let rxTarget=0;sync();requestAnimationFrame(loop);

// ---------- physical keyboard ----------
addEventListener('keydown',e=>{if(!S.on)return;ac();
 if(/^[0-9.]$/.test(e.key)&&S.buf.length<7){S.buf+=e.key;beep(1100,.03)}
 else if(e.key==='Enter')A.ENT();else if(e.key==='Backspace')S.buf=S.buf.slice(0,-1);
 else if(e.key==='ArrowUp')kFq.cb(1);else if(e.key==='ArrowDown')kFq.cb(-1);
 else if(e.key==='ArrowRight')chg(1);else if(e.key==='ArrowLeft')chg(-1);
 else if(e.key===' '){e.preventDefault();if(!S.tx){S.tx=1;txTone(1)}}});
addEventListener('keyup',e=>{if(e.key===' '){S.tx=0;txTone(0)}});
</script></body></html>
