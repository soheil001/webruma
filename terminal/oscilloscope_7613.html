<!DOCTYPE html>
<html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tektronix 7613 – Interactive Oscilloscope</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15191a;color:#cfe;font:14px system-ui,Tahoma,sans-serif}
#app{display:flex;flex-wrap:wrap;gap:16px;padding:8px;justify-content:center;align-items:flex-start}
#wrap{position:relative;flex:none}#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#base{display:block;width:100%;height:100%;-webkit-user-drag:none;user-select:none}
.hs{position:absolute;cursor:pointer;touch-action:none;user-select:none;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hs:hover{outline:1px solid rgba(255,255,255,.55)}
.hs.on{background:rgba(120,255,140,.28);box-shadow:0 0 10px 3px rgba(120,255,140,.85);overflow:visible}
.knob{border-radius:50%}.knob.on{box-shadow:none;background:none}.knob canvas{width:100%;height:100%;display:block;pointer-events:none}
.bdg{background:rgba(0,0,0,.6);color:#9fffb0;font-family:monospace;font-weight:bold}
.led{position:absolute;pointer-events:none;border-radius:50%}.led.on{background:rgba(90,255,120,.8);box-shadow:0 0 12px 5px rgba(90,255,120,.9)}
body.dbg .hs{outline:1px dashed #ff0}
#cv{position:absolute;pointer-events:none}
#panel{width:360px;max-width:100%;background:#0b100d;border:1px solid #274;border-radius:10px;padding:12px}
#panel h3{margin:4px 0 8px;font-size:14px;color:#8fd}
.ro{border:1px solid #1d3;border-radius:6px;padding:6px;margin-bottom:6px;opacity:.45}.ro.v{opacity:1;border-color:#3f6}
.ro h4{margin:0 0 4px;color:#9fc;font-size:12px}.g{display:inline-block;width:49%;margin-bottom:3px}
.g i{display:block;font-style:normal;font-size:10px;color:#6a8}
.g b,.big b{font:bold 17px 'Courier New',monospace;color:#5dff9a;text-shadow:0 0 8px #3f8;background:#030a05;padding:1px 6px;border-radius:3px;display:inline-block;min-width:96px}
.big{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.big div{flex:1}.big i{display:block;font-style:normal;font-size:10px;color:#6a8}
.in{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:12px}.in b{width:24px;color:#9fc}
.in select,.in input{background:#101a14;color:#cfe;border:1px solid #274;border-radius:4px;padding:3px;width:80px}.in label{display:flex;align-items:center;gap:3px}
.note{font-size:11px;color:#8a9;line-height:1.8;direction:rtl}
</style></head><body>

const TN={off:'خاموش',sine:'سینوسی',square:'مربعی',tri:'مثلثی',saw:'دندانه‌ای'},COL=['#7dffb0','#c8ff8a','#8affea','#e6ffa0'],RMS={sine:1/(2*Math.SQRT2),square:.5,tri:1/(2*Math.sqrt(3)),saw:1/(2*Math.sqrt(3))};
const SD=()=>({pow:1,vm:'left',ts:'left',hold:0,dots:0,saved:null,saveReq:0,ri:30,gi:30,pe:10,si:25,fo:20,fi:30,lvl:20,hp:20,nz:0,td:9,
 pl:{A:{mode:'alt',ch:[{vd:7,pos:30,cpl:'DC',inv:0},{vd:7,pos:10,cpl:'DC',inv:0}]},B:{mode:'ch1',ch:[{vd:7,pos:20,cpl:'DC',inv:0},{vd:7,pos:20,cpl:'DC',inv:0}]}},
 sig:[{t:'sine',f:1000,a:2},{t:'square',f:1000,a:1},{t:'off',f:1000,a:1},{t:'off',f:1000,a:1}]});
let S=SD();const P=(p,c)=>S.pl[p].ch[c];
const r4=x=>+x.toPrecision(4);
const fV=v=>v>=1?v.toFixed(3)+' V':(v*1000).toFixed(1)+' mV',fVd=v=>v>=1?v+' V':r4(v*1000)+' mV';
const fF=f=>f>=1e6?(f/1e6).toFixed(3)+' MHz':f>=1e3?(f/1e3).toFixed(3)+' kHz':f.toFixed(2)+' Hz';
const fT=t=>!isFinite(t)?'---':t>=1?r4(t)+' s':t>=1e-3?r4(t*1e3)+' ms':r4(t*1e6)+' µs';
function sv(s,t){if(s.t=='off')return 0;const p=s.f*t,ph=p-Math.floor(p),A=s.a/2;
 return s.t=='sine'?A*Math.sin(2*Math.PI*p):s.t=='square'?(ph<.5?A:-A):s.t=='tri'?A*(ph<.5?4*ph-1:3-4*ph):A*(2*ph-1)}
const sum=(a,b,l)=>({f:t=>a.f(t)+b.f(t),vd:a.vd,pos:a.pos,label:l||a.label[0]+'+',i:a.i});
function mk(p,c){const ch=P(p,c),i=(p=='B')*2+c;return{f:t=>ch.cpl=='GND'?0:(ch.inv?-1:1)*sv(S.sig[i],t),vd:VD[ch.vd],pos:ch.pos,label:p+(c+1),i}}
function plug(p){const m=S.pl[p].mode;return m=='ch1'?[mk(p,0)]:m=='ch2'?[mk(p,1)]:m=='add'?[sum(mk(p,0),mk(p,1))]:[mk(p,0),mk(p,1)]}
function traces(){const a=plug('A'),b=plug('B');return S.vm=='left'?a:S.vm=='right'?b:S.vm=='add'?[sum(a[0],b[0],'A+B')]:[...a,...b]}
function trigT(r){const f=Math.max(S.sig[r.i].f,.01),lv=(S.lvl-20)*.2*r.vd,L=Math.min(2/f,5),dt=Math.max(Math.min(1/f/400,TD[S.td]/100),L/3000);
 let pv=r.f(0);for(let t=dt;t<L;t+=dt){const v=r.f(t);if(pv<lv&&v>=lv)return t;pv=v}return 0}
function init(){
 const nw=base.naturalWidth,nh=base.naturalHeight,k=nw/474;stage.style.width=nw+'px';stage.style.height=nh+'px';
 const E={},knobs=[];
 function hs(x,y,w,h,title,txt,cls){const d=document.createElement('div');d.className='hs '+(cls||'');
  d.style.cssText=`left:${(x-w/2)*k}px;top:${(y-h/2)*k}px;width:${w*k}px;height:${h*k}px;font-size:${7*k}px`;d.title=title||'';if(txt)d.textContent=txt;stage.appendChild(d);return d}
 function btn(key,x,y,w,h,title,fn){const d=hs(x,y,w,h,title);d.addEventListener('pointerdown',e=>{e.preventDefault();fn();refresh()});E[key]=d}
 // screen canvas
 const cv=document.createElement('canvas');cv.id='cv';cv.width=660;cv.height=468;
 cv.style.cssText=`left:${52*k}px;top:${62*k}px;width:${220*k}px;height:${156*k}px`;stage.appendChild(cv);
 // knobs
 function drawK(K){const c=K.cv,g=c.getContext('2d'),s=c.width,R=K.r*k;g.clearRect(0,0,s,s);g.save();g.translate(s/2,s/2);
  g.rotate(((K.v-K.def)*270/(K.n-1))*Math.PI/180);g.beginPath();g.arc(0,0,s/2,0,7);g.clip();g.drawImage(base,K.x*k-R,K.y*k-R,2*R,2*R,-s/2,-s/2,s,s);g.restore()}
 function addKnob([id,x,y,r,n,def,title,on]){const d=hs(x,y,2*r,2*r,title,'','knob'),c=document.createElement('canvas');c.width=c.height=Math.max(24,Math.round(2*r*k*2));d.appendChild(c);
  const K={id,x,y,r,n,def,v:def,cv:c,on};knobs.push(K);
  const set=s=>{K.v=Math.max(0,Math.min(n-1,K.v+s));on(K.v);drawK(K);refresh()};
  let dr=null;const th=n>20?4:14;
  d.addEventListener('pointerdown',e=>{d.setPointerCapture(e.pointerId);dr={x:e.clientX,y:e.clientY,acc:0,mv:0};e.preventDefault()});
  d.addEventListener('pointermove',e=>{if(!dr)return;const dd=(dr.y-e.clientY)+(e.clientX-dr.x);dr.mv+=Math.abs(dd);dr.acc+=dd;dr.x=e.clientX;dr.y=e.clientY;
   const st=Math.trunc(dr.acc/th);if(st){dr.acc-=st*th;set(st)}});
  d.addEventListener('pointerup',e=>{if(dr&&dr.mv<5){const b=d.getBoundingClientRect();set(e.clientX<b.left+b.width/2?-1:1)}dr=null});
  d.addEventListener('wheel',e=>{e.preventDefault();set(e.deltaY<0?1:-1)},{passive:false});drawK(K)}
 const KD=[['ri',431,57,16,41,30,'READOUT INTENSITY',v=>S.ri=v],['gi',431,106,15,41,30,'GRATICULE ILLUM',v=>S.gi=v],
  ['pe',431,157,15,41,10,'PERSISTENCE (glow)',v=>S.pe=v],['si',371,243,14,41,25,'STORED INTENSITY',v=>S.si=v],['fo',394,118,6,41,20,'FOCUS',v=>S.fo=v],
  ['fi',343,398,10,41,30,'TRACE INTENSITY',v=>S.fi=v],['lvl',345,350,13,41,20,'TRIGGER LEVEL',v=>S.lvl=v],['hp',351,521,16,41,20,'DELAY TIME MULT (horizontal position)',v=>S.hp=v],
  ['nz',351,471,11,41,0,'NOISE',v=>S.nz=v],['td',417,447,30,18,9,'TIME / DIV',v=>S.td=v]];
 [['A',[116,362],[59,337],[120,442],[121,517],[62,492],30,10],['B',[267,362],[210,337],[273,442],[269,515],[212,490],20,20]].forEach(([p,v1,p1,m,v2,p2,d1,d2])=>{
  KD.push([p+'v1',...v1,22,10,7,p+'-CH1 VOLTS/DIV',v=>P(p,0).vd=v],[p+'p1',...p1,12,41,d1,p+'-CH1 POSITION',v=>P(p,0).pos=v],
  [p+'m',...m,18,5,1,p+' DISPLAY MODE (CH1/ALT/ADD/CHOP/CH2)',v=>S.pl[p].mode=MODES[v]],
  [p+'v2',...v2,22,10,7,p+'-CH2 VOLTS/DIV',v=>P(p,1).vd=v],[p+'p2',...p2,12,41,d2,p+'-CH2 POSITION',v=>P(p,1).pos=v])});
 KD.forEach(addKnob);
 // buttons
 [['left',352,52],['alt',352,75],['add',352,97],['chop',352,118],['right',352,140]].forEach(([m,x,y])=>btn('vm_'+m,x,y,22,16,'VERT MODE: '+m.toUpperCase(),()=>S.vm=m));
 [['left',384,52],['vert',384,74],['right',384,97]].forEach(([m,x,y])=>btn('ts_'+m,x,y,22,16,'TRIG SOURCE: '+m.toUpperCase(),()=>S.ts=m));
 btn('hold',385,162,26,16,'STORE (freeze display)',()=>S.hold^=1);btn('dots',385,184,26,16,'STORE (dots / line)',()=>S.dots^=1);
 btn('save',428,200,26,16,'SAVE (keep reference trace)',()=>S.saveReq=1);btn('erase',428,243,26,16,'ERASE',()=>S.saved=null);
 btn('pow',440,271,22,16,'POWER',()=>S.pow^=1);
 const led=document.createElement('div');led.className='led';led.style.cssText=`left:${407*k}px;top:${265*k}px;width:${12*k}px;height:${12*k}px`;stage.appendChild(led);
 btn('reset',402,541,30,30,'RESET ALL',()=>{S=SD();knobs.forEach(K=>{K.v=K.def;K.on(K.v);drawK(K)});syncIn()});E.reset.style.borderRadius='50%';
 const cp=[],iv=[],bn=[];
 [['A',0,115,408],['A',1,118,561],['B',0,265,408],['B',1,268,561]].forEach(([p,c,x,y])=>{const d=hs(x,y,52,13,'COUPLING AC/GND/DC','DC','bdg');
  d.addEventListener('pointerdown',e=>{e.preventDefault();const ch=P(p,c);ch.cpl=CPL[(CPL.indexOf(ch.cpl)+1)%3];refresh()});cp.push([p,c,d])});
 [['A',35,437],['B',186,437]].forEach(([p,x,y])=>{const d=hs(x,y,14,28,'CH2 POLARITY INVERT');d.addEventListener('pointerdown',e=>{e.preventDefault();P(p,1).inv^=1;refresh()});iv.push([p,d])});
 [[44,383],[46,543],[195,383],[199,537]].forEach(([x,y],i)=>{const d=hs(x,y,22,22,'INPUT BNC (کلیک: نوع سیگنال)');d.style.borderRadius='50%';
  d.addEventListener('pointerdown',e=>{e.preventDefault();const s=S.sig[i];s.t=TYPES[(TYPES.indexOf(s.t)+1)%5];syncIn();refresh()});bn.push(d)});
 // input panel
 const inp=document.getElementById('inp'),rows=[];
 ['A1','A2','B1','B2'].forEach((n,i)=>{const r=document.createElement('div');r.className='in';
  r.innerHTML=`<b>${n}</b><select>${TYPES.map(t=>`<option value="${t}">${TN[t]}</option>`).join('')}</select><label>Hz<input type="number" step="any" min="0.01"></label><label>Vpp<input type="number" step="any" min="0"></label>`;
  const [se,fi,ai]=[r.querySelector('select'),...r.querySelectorAll('input')];
  se.onchange=()=>{S.sig[i].t=se.value;refresh()};fi.oninput=()=>{S.sig[i].f=Math.max(.01,+fi.value||1);refresh()};ai.oninput=()=>{S.sig[i].a=Math.max(0,+ai.value||0);refresh()};
  inp.appendChild(r);rows.push([se,fi,ai])});
 function syncIn(){rows.forEach(([se,fi,ai],i)=>{se.value=S.sig[i].t;fi.value=S.sig[i].f;ai.value=S.sig[i].a})}
 // readout panel
 function dro(){const tr=traces(),tt=trigTrace(tr);let h=`<div class="big"><div><i>TIME/DIV</i><b>${fT(TD[S.td])}</b></div><div><i>TRIG LEVEL (${tt.label})</i><b>${fV(Math.abs((S.lvl-20)*.2*tt.vd)).replace(/^/,S.lvl<20?'-':'+')}</b></div></div>`;
  ['A1','A2','B1','B2'].forEach((n,i)=>{const s=S.sig[i],p=n[0],c=i%2,ch=P(p,c),on=s.t!='off'&&ch.cpl!='GND',vis=tr.some(r=>r.i==i);
   h+=`<div class="ro ${vis?'v':''}"><h4>${n} — ${on?TN[s.t]:'—'} — ${ch.cpl}${ch.inv?' INV':''} — ${fVd(VD[ch.vd])}/div</h4>
   <div class="g"><i>Vpp</i><b>${fV(on?s.a:0)}</b></div><div class="g"><i>Vrms</i><b>${fV(on?s.a*RMS[s.t]:0)}</b></div>
   <div class="g"><i>Frequency</i><b>${on?fF(s.f):'0.00 Hz'}</b></div><div class="g"><i>Period</i><b>${on?fT(1/s.f):'---'}</b></div></div>`});
  document.getElementById('dro').innerHTML=h}
 function trigTrace(tr){return S.ts=='left'?plug('A')[0]:S.ts=='right'?plug('B')[0]:tr[0]}
 function refresh(){['left','alt','add','chop','right'].forEach(m=>E['vm_'+m].classList.toggle('on',S.vm==m));
  ['left','vert','right'].forEach(m=>E['ts_'+m].classList.toggle('on',S.ts==m));
  ['hold','dots','pow'].forEach(m=>E[m].classList.toggle('on',!!S[m]));led.classList.toggle('on',!!S.pow);
  cp.forEach(([p,c,d])=>d.textContent=P(p,c).cpl);iv.forEach(([p,d])=>d.classList.toggle('on',!!P(p,1).inv));
  bn.forEach((d,i)=>d.classList.toggle('on',S.sig[i].t!='off'));dro()}
 // render
 const g=cv.getContext('2d'),W=660,H=468,q=3,dw=W/10,dh=H/8;
 function draw(a,col,al){g.save();g.beginPath();g.rect(0,0,W,H);g.clip();g.strokeStyle=g.fillStyle=col;g.globalAlpha=al;g.shadowColor=col;
  g.shadowBlur=q*(.8+S.pe/12);g.lineWidth=q*(.5+Math.abs(S.fo-20)/20*1.2);g.lineJoin='round';
  if(S.dots)a.forEach(p=>g.fillRect(p[0]-1,p[1]-1,2.5,2.5));else{g.beginPath();a.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()}g.restore()}
 function render(){requestAnimationFrame(render);
  if(!S.pow){g.fillStyle='#030a0a';g.fillRect(0,0,W,H);return}
  if(S.hold)return;
  g.fillStyle='#0a2a2a';g.fillRect(0,0,W,H);
  g.strokeStyle=`rgba(120,235,215,${.12+.5*S.gi/40})`;g.lineWidth=q*.3;g.beginPath();
  for(let i=0;i<=10;i++){g.moveTo(i*dw,0);g.lineTo(i*dw,H)}for(let j=0;j<=8;j++){g.moveTo(0,j*dh);g.lineTo(W,j*dh)}g.stroke();
  g.lineWidth=q*.45;g.beginPath();for(let i=0;i<50;i++){const x=i*dw/5;g.moveTo(x,H/2-q*2);g.lineTo(x,H/2+q*2)}for(let j=0;j<40;j++){const y=j*dh/5;g.moveTo(W/2-q*2,y);g.lineTo(W/2+q*2,y)}g.stroke();
  const tr=traces(),tt=trigTrace(tr),T=TD[S.td],t0=trigT(tt),hp=(S.hp-20)*.2,N=500;
  const pts=tr.map(r=>{const a=[];for(let n=0;n<=N;n++){const t=t0-hp*T+n/N*10*T;let v=r.f(t);if(S.nz)v+=(Math.random()-.5)*S.nz/40*.6*r.vd;a.push([n/N*W,H/2-(v/r.vd+(r.pos-20)*.2)*dh])}return a});
  if(S.saveReq){S.saved=pts.map((a,j)=>({a,col:COL[tr[j].i]}));S.saveReq=0}
  if(S.saved)S.saved.forEach(s=>draw(s.a,'#6aa8ff',.15+.6*S.si/40));
  pts.forEach((a,j)=>draw(a,COL[tr[j].i],.5+.5*S.fi/40));
  if(S.ri>0){g.fillStyle=`rgba(150,255,210,${.25+.75*S.ri/40})`;g.font=`${q*6.5}px monospace`;g.textBaseline='top';g.textAlign='left';
   g.fillText('TIME '+fT(T)+'/div',q*4,q*3);g.textAlign='right';g.fillText(`TRIG ${tt.label} ${(S.lvl-20)*.2>=0?'+':''}${((S.lvl-20)*.2).toFixed(1)}div`,W-q*4,q*3);
   g.textAlign='left';g.textBaseline='bottom';tr.forEach((r,j)=>g.fillText(r.label+' '+fVd(r.vd)+'/div',q*4+j*W/tr.length,H-q*3));
   if(S.hold)g.fillText('STORE',W/2-q*10,q*14)}}
 function fit(){const wide=innerWidth>1000,aw=wide?innerWidth-420:innerWidth-16,sc=Math.max(.3,Math.min(aw/nw,wide?(innerHeight-16)/nh:9,3));
  stage.style.transform=`scale(${sc})`;wrap.style.width=nw*sc+'px';wrap.style.height=nh*sc+'px'}
 addEventListener('resize',fit);addEventListener('keydown',e=>{if(e.key=='d'||e.key=='D')document.body.classList.toggle('dbg')});
 fit();syncIn();refresh();render()}
if(base.complete&&base.naturalWidth)init();else base.onload=init;
</script></body></html>
