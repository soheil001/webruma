<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WC-7A Wireless Communications Unit</title>
<style>
:root{--bg:#cbbd9d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a271f}}
:root[data-theme="dark"]{--bg:#2a271f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}

/* ===== The radio = the photo itself ===== */
.radio{position:relative;container-type:inline-size;width:min(100vw,calc(100dvh * 1200 / 2133));aspect-ratio:1200/2133;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.radio>img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.stage{position:absolute;inset:0;--u:calc(100cqw / 1200)}
.crop{position:absolute;background-repeat:no-repeat;pointer-events:none}
.lever{transition:transform .14s ease}
.lever.up{transform:scaleY(-1)}

/* ===== Invisible hotspots ===== */
.hs{position:absolute;margin:0;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:6%/12%}
.hs.round{border-radius:50%}
.hs:active{background:rgba(0,0,0,.28);box-shadow:inset 0 2px 6px rgba(0,0,0,.65)}
.hs.lv:active{background:transparent;box-shadow:none}
.hs:focus-visible,.knob:focus-visible{outline:2px dashed #7CFC00;outline-offset:2px}
body.dbg .hs{outline:2px solid #7CFC00;background:rgba(124,252,0,.12)}
.hs:hover:not(.lv){background:rgba(255,255,255,.07)}

/* ===== Knobs (rotating crops of the photo) ===== */
.knob{position:absolute;border-radius:50%;background-repeat:no-repeat;touch-action:none;cursor:grab;will-change:transform}
.knob .mark{position:absolute;left:48.9%;top:4%;width:2.2%;height:13%;border-radius:2px;background:rgba(25,22,18,.6);display:none}
.knob.marked .mark{display:block}

/* ===== LED lights ===== */
.led{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 40%,#555a5b,#2c3031);pointer-events:none;transition:background .15s,box-shadow .15s}
.led.on{background:radial-gradient(circle at 50% 42%,#fff6c4 0 22%,#ffc93c 58%,#d99a1a 100%);box-shadow:0 0 calc(var(--u)*9) calc(var(--u)*2) rgba(255,190,50,.75)}
.led.tx{background:radial-gradient(circle at 50% 42%,#ffd3c4 0 22%,#ff5a36 58%,#b32a12 100%);box-shadow:0 0 calc(var(--u)*9) calc(var(--u)*2) rgba(255,70,40,.8)}

/* ===== LCD screen ===== */
.lcd{position:absolute;overflow:hidden;border-radius:calc(var(--u)*14);color:#2b1904;
  font:700 calc(var(--u)*43)/1 "DejaVu Sans Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
  background:radial-gradient(120% 110% at 50% 55%,#fdb946 0%,#f9a93a 50%,#ee8a17 100%);
  box-shadow:inset 0 calc(var(--u)*8) calc(var(--u)*18) rgba(120,50,0,.55),inset 0 calc(var(--u)*-6) calc(var(--u)*14) rgba(255,200,100,.25);
  pointer-events:none}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(60,25,0,.07) 0 1px,transparent 1px calc(var(--u)*3)),repeating-linear-gradient(90deg,rgba(60,25,0,.05) 0 1px,transparent 1px calc(var(--u)*3))}
.lcd.off{background:linear-gradient(160deg,#2c1f11,#17100a);box-shadow:inset 0 0 calc(var(--u)*30) #000}
.lcd.off .scr{visibility:hidden}
.title{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*64);display:flex;align-items:center;justify-content:center;
  border-bottom:calc(var(--u)*3) solid #2b1904;white-space:pre;text-align:center}
.title.blink{animation:bl .7s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.row{position:absolute;left:calc(var(--u)*30);right:calc(var(--u)*24);height:calc(var(--u)*46);padding-left:calc(var(--u)*12);display:flex;align-items:center;white-space:pre}
.row.sel{background:#2b1904;color:#f9a93a}
.bar{position:absolute;left:calc(var(--u)*19);top:calc(var(--u)*303);width:calc(var(--u)*509);height:calc(var(--u)*17);
  border:calc(var(--u)*2) solid #2b1904;display:grid;grid-template-columns:repeat(10,1fr);gap:calc(var(--u)*3);box-sizing:content-box}
.bar i{background:#35200a}
.bar i.e{background:transparent}
.spec{position:absolute;left:calc(var(--u)*24);top:calc(var(--u)*72);width:calc(var(--u)*505);height:calc(var(--u)*218);display:none}

/* ===== Meter ===== */
.meter{position:absolute;pointer-events:none}
.meter img,.meter svg{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>

const SHOW_KNOB_MARK = true;                 // small notch so knob rotation is visible

const W = 1200, H = 2133;                    // photo size (all coordinates are in photo pixels)
const stage = document.getElementById('stage');

/* ---------- helpers: place by photo pixels ---------- */
const mk = (t, c) => { const e = document.createElement(t); if (c) e.className = c; return e; };
function place(el, [x0, y0, x1, y1]) {
  const s = el.style;
  s.left = x0 / W * 100 + '%'; s.top = y0 / H * 100 + '%';
  s.width = (x1 - x0) / W * 100 + '%'; s.height = (y1 - y0) / H * 100 + '%';
}
function crop(el, box) {                      // show exactly that part of the photo inside el
  const [x0, y0, x1, y1] = box, w = x1 - x0, h = y1 - y0;
  place(el, box);
  const s = el.style;
  s.backgroundImage = `url("${IMG}")`;
  s.backgroundSize = (W / w * 100) + '% ' + (H / h * 100) + '%';
  s.backgroundPosition = (x0 / (W - w) * 100) + '% ' + (y0 / (H - h) * 100) + '%';
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad2 = n => String(n).padStart(2, '0');

/* ---------- hotspot map (photo pixels: x0,y0,x1,y1) ---------- */
const BOX = {
  pwr:[320,1478,400,1600], mode:[439,1478,519,1600], sq:[558,1478,638,1600], tx:[678,1478,758,1600],
  sel:[815,1225,875,1263], scan:[893,1225,953,1263], port:[893,1290,953,1328], ent1:[815,1353,875,1391], ent2:[893,1353,953,1391],
  chan:[1036,865,1062,968], data:[1036,1035,1062,1140],
  rf:[848,385,920,434], phone:[672,460,714,500], aux:[764,460,806,500], usb:[848,462,928,498], dc:[838,532,938,560],
  spk:[290,503,462,675], meter:[815,1452,950,1540], lcd:[338,770,886,1098]
};
const TUNE = [390,1213,574,1397];     // freq/tune knob
const VOLK = [660,1253,770,1363];     // volume knob
const LEDS = [[807,734],[840,734],[864,734]];
const LEVER_X = { pwr:360, mode:479, sq:598, tx:718 };

/* ---------- radio state ---------- */
const MODES = ['AM','FM','USB','LSB','CW'];
const FREQS = [144.100,144.200,144.300,144.350,144.400,144.450,144.475,144.500,144.550,144.600,144.650,144.700,144.800,145.000,145.200,145.500];
const chans = FREQS.map(f => ({ f, m: 0 }));
const S = { pwr:true, modeIdx:0, ch:8, freq:144.500, sq:false, tx:false, volA:-15, gain:50, field:-1, page:0,
  scan:false, batt:64, dc:false, phone:false, aux:false, usb:false, port:false, msg:'', msgT:0, rssi:-74 };
const volume = () => Math.pow((S.volA + 135) / 270, 2);
const sigBase = f => { let b = -98; for (const c of chans) { const d = (f - c.f) / 0.018; b = Math.max(b, -98 + 24 * Math.exp(-d * d)); } return b; };

/* ---------- audio (static noise + beeps) ---------- */
let AC = null, noiseG = null, filt = null;
function audio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return AC; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  filt = AC.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = 1500; filt.Q.value = .5;
  noiseG = AC.createGain(); noiseG.gain.value = 0;
  src.connect(filt); filt.connect(noiseG); noiseG.connect(AC.destination); src.start();
  return AC;
}
function beep(f = 1000, dur = .06, v = .3, force = false) {
  const a = audio(); if (!a || (!S.pwr && !force)) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = 'square'; o.frequency.value = f; g.gain.value = 0; o.connect(g); g.connect(a.destination);
  g.gain.linearRampToValueAtTime(Math.max(.0001, v * Math.max(volume(), .04)), t + .005);
  g.gain.linearRampToValueAtTime(0, t + dur); o.start(t); o.stop(t + dur + .02);
}
function updAudio() {
  if (!AC || !noiseG) return;
  const open = S.pwr && !S.tx && (!S.sq || S.rssi > -85);
  const lvl = clamp((-S.rssi - 40) / 60, 0, 1);
  const g = open ? volume() * (.04 + .30 * lvl) * (.5 + S.gain / 100) : 0;
  noiseG.gain.setTargetAtTime(g, AC.currentTime, .05);
  const m = MODES[S.modeIdx];
  filt.type = m === 'FM' ? 'lowpass' : 'bandpass';
  filt.frequency.value = m === 'FM' ? 5000 : (m === 'CW' ? 700 : 1600);
  filt.Q.value = m === 'CW' ? 6 : .5;
}
addEventListener('pointerdown', () => audio(), { passive: true });

/* ---------- LCD ---------- */
const lcd = mk('div', 'lcd'); place(lcd, BOX.lcd); stage.appendChild(lcd);
const scr = mk('div', 'scr'); scr.style.cssText = 'position:absolute;inset:0'; lcd.appendChild(scr);
const titleEl = mk('div', 'title'); scr.appendChild(titleEl);
const rowEls = [0, 1, 2, 3, 4].map(i => { const r = mk('div', 'row'); r.style.top = `calc(var(--u)*${67 + 46 * i})`; scr.appendChild(r); return r; });
const spec = mk('canvas', 'spec'); spec.width = 505; spec.height = 218; scr.appendChild(spec);
const barEl = mk('div', 'bar'); scr.appendChild(barEl);
const segs = Array.from({ length: 10 }, () => barEl.appendChild(mk('i')));

function flash(text, ms = 1600) { S.msg = text; S.msgT = performance.now() + ms; render(); setTimeout(render, ms + 30); }

function rows() {
  const f = S.freq.toFixed(3), mode = MODES[S.modeIdx], r = Math.round(S.rssi);
  if (S.page === 1) return [
    'GAIN: ' + S.gain + '%', 'SQL:  ' + (S.sq ? 'ON' : 'OFF'), 'VOL:  ' + Math.round((S.volA + 135) / 270 * 100) + '%',
    'PWR:  ' + (S.dc ? 'DC 12V' : 'BATTERY'),
    'LINK: ' + (S.usb ? 'USB' : S.phone ? 'PHONE' : S.aux ? 'AUX' : S.port ? 'PORT' : '---')];
  return ['FREQ: ' + f + ' MHz', S.tx ? 'TX:   ON AIR 5W' : 'RSSI: ' + r + 'dBm', 'MODE: ' + mode, 'CH:   ' + pad2(S.ch), 'BATTERY: ' + Math.round(S.batt) + '%'];
}
const FIELD_ROW = [0, 2, 3];   // SEL cycles FREQ → MODE → CH
function render() {
  lcd.classList.toggle('off', !S.pwr);
  ledEls[0].className = 'led' + (S.pwr ? ' on' : '');
  ledEls[1].className = 'led' + (S.pwr && !S.tx && (!S.sq || S.rssi > -85) ? ' on' : '');
  ledEls[2].className = 'led' + (S.pwr ? (S.tx ? ' tx' : ' on') : '');
  syncLevers();
  if (!S.pwr) return;
  const showMsg = performance.now() < S.msgT;
  titleEl.textContent = showMsg ? S.msg : S.scan ? 'SCANNING...' : ['SYS-COM V1.0', 'STATUS', 'SPECTRUM'][S.page];
  titleEl.classList.toggle('blink', !showMsg && S.scan);
  const rs = rows();
  rowEls.forEach((el, i) => {
    el.style.display = S.page === 2 ? 'none' : 'flex';
    el.textContent = rs[i];
    el.classList.toggle('sel', S.page === 0 && S.field >= 0 && FIELD_ROW[S.field] === i);
  });
  spec.style.display = S.page === 2 ? 'block' : 'none';
  const lit = Math.ceil(clamp(S.batt, 0, 100) / 10);
  segs.forEach((s, i) => s.className = i < lit ? '' : 'e');
  if (S.page === 2) drawSpec();
}
function drawSpec() {
  const c = spec.getContext('2d'); c.clearRect(0, 0, 505, 218); c.fillStyle = '#35200a';
  const n = 40, bw = 505 / n;
  for (let i = 0; i < n; i++) {
    const f = S.freq - .25 + i * .0125 * 1;
    const v = clamp((sigBase(f) + 98 + (S.gain - 50) * .16) / 26 + Math.random() * .08, .04, 1);
    c.fillRect(i * bw + 2, 218 - v * 200, bw - 4, v * 200);
  }
  c.fillRect(505 / 2 - 1, 0, 3, 14);
}

/* ---------- LEDs ---------- */
const ledEls = LEDS.map(([x, y]) => { const e = mk('div', 'led'); place(e, [x - 7.5, y - 7.5, x + 7.5, y + 7.5]); stage.appendChild(e); return e; });

/* ---------- Signal meter (clean face + animated needle) ---------- */
const meter = mk('div', 'meter'); place(meter, BOX.meter); stage.appendChild(meter);
const mimg = mk('img'); mimg.src = METER_CLEAN; mimg.alt = ''; meter.appendChild(mimg);
meter.insertAdjacentHTML('beforeend',
  `<svg viewBox="0 0 135 88" preserveAspectRatio="none" aria-hidden="true">
     <g id="ndl"><line x1="68" y1="76" x2="68" y2="18" stroke="rgba(0,0,0,.22)" stroke-width="1.6" stroke-linecap="round"/>
     <line x1="67" y1="76" x2="67" y2="18" stroke="#1b1814" stroke-width="1.5" stroke-linecap="round"/></g></svg>`);
const ndl = meter.querySelector('#ndl');
let needle = -43;
function needleLoop(t) {
  let target = -43;
  if (S.pwr) {
    const fr = S.tx ? .88 + Math.sin(t / 90) * .03 : clamp((S.rssi + 100) / 60, 0, 1);
    target = -43 + 86 * fr;
  }
  needle += (target - needle) * .1;
  ndl.setAttribute('transform', `rotate(${(needle + (S.pwr ? Math.sin(t / 130) * .35 : 0)).toFixed(2)} 67 93)`);
  requestAnimationFrame(needleLoop);
}
requestAnimationFrame(needleLoop);

/* ---------- Toggle switches (flipped crops of the photo) ---------- */
const levers = {};
for (const k of ['pwr', 'mode', 'sq', 'tx']) {
  const e = mk('div', 'crop lever'); crop(e, [LEVER_X[k] - 38, 1482, LEVER_X[k] + 38, 1592]); stage.appendChild(e); levers[k] = e;
}
function syncLevers() {
  levers.pwr.classList.toggle('up', !S.pwr);        // lever down = ON (as in the photo)
  levers.mode.classList.toggle('up', S.modeIdx !== 0);
  levers.sq.classList.toggle('up', S.sq);
  levers.tx.classList.toggle('up', S.tx);
}

/* ---------- Hotspot buttons ---------- */
function hot(name, fn, label, opts = {}) {
  const b = mk('button', 'hs' + (opts.cls ? ' ' + opts.cls : '')); b.type = 'button';
  b.setAttribute('aria-label', label); b.title = label; place(b, BOX[name]);
  b.addEventListener('click', e => { audio(); fn(e); });
  stage.appendChild(b); return b;
}
const needPwr = fn => (...a) => { if (S.pwr) fn(...a); };

hot('pwr', () => {
  S.pwr = !S.pwr;
  if (S.pwr) { beep(1500, .08, .3); beep(900, .05, .2); flash('SYS-COM V1.0'); } else { S.scan = false; S.tx = false; S.field = -1; }
  render();
}, 'PWR – power', { cls: 'lv' });
hot('mode', needPwr(() => { S.modeIdx = S.modeIdx === 0 ? 1 : 0; beep(1100); flash('MODE: ' + MODES[S.modeIdx]); }), 'MODE – AM / FM', { cls: 'lv' });
hot('sq', needPwr(() => { S.sq = !S.sq; beep(900); flash('SQUELCH ' + (S.sq ? 'ON' : 'OFF')); }), 'SQ – squelch', { cls: 'lv' });
hot('tx', needPwr(() => { S.tx = !S.tx; beep(S.tx ? 1700 : 1300, .09); flash(S.tx ? 'TRANSMIT' : 'RECEIVE'); }), 'TX – transmit', { cls: 'lv' });

hot('sel', needPwr(() => { beep(1200, .04); S.page = 0; S.field = (S.field + 1) % 4 === 3 ? -1 : (S.field + 1) % 4; render(); }), 'SEL – select field (FREQ / MODE / CH)');
hot('scan', needPwr(() => { S.scan = !S.scan; beep(S.scan ? 1500 : 800, .06); if (S.scan) { S.page = 0; S.field = -1; } render(); }), 'SCAN – scan channels');
hot('port', needPwr(() => { S.port = !S.port; beep(1000, .04); flash('PORT: ' + (S.port ? 'OPEN' : 'CLOSED')); }), 'PORT');
hot('ent1', needPwr(() => {
  chans[S.ch - 1] = { f: S.freq, m: S.modeIdx }; beep(1800, .05); setTimeout(() => beep(2200, .05), 80); flash('CH ' + pad2(S.ch) + ' SAVED');
}), 'ENT – save to channel');
hot('ent2', needPwr(() => { S.field = -1; S.scan = false; beep(1400, .05); flash('OK'); }), 'ENT – confirm');

function changeCh(dir) {
  if (!S.pwr) return; S.scan = false;
  S.ch = ((S.ch - 1 + dir + 16) % 16) + 1; const c = chans[S.ch - 1]; S.freq = c.f; S.modeIdx = c.m;
  S.page = 0; beep(1300, .04); render();
}
const chanBtn = hot('chan', e => changeCh(e.shiftKey ? -1 : 1), 'CHANNEL SELECT – click: next, Shift/right-click: previous');
chanBtn.addEventListener('contextmenu', e => { e.preventDefault(); changeCh(-1); });
hot('data', needPwr(() => { S.page = (S.page + 1) % 3; beep(1100, .04); render(); }), 'DATA – change screen');

hot('meter', needPwr(() => { S.page = 2; beep(1000, .04); render(); }), 'SIGNAL meter – spectrum');
hot('spk', () => { beep(800, .08, .4); setTimeout(() => beep(1200, .08, .4), 110); }, 'Speaker – test', {});
hot('phone', needPwr(() => { S.phone = !S.phone; flash('PHONE: ' + (S.phone ? 'PLUGGED' : 'FREE')); }), 'PHONE jack', { cls: 'round' });
hot('aux', needPwr(() => { S.aux = !S.aux; flash('AUX: ' + (S.aux ? 'LINKED' : 'FREE')); }), 'AUX jack', { cls: 'round' });
hot('usb', needPwr(() => { S.usb = !S.usb; flash('USB: ' + (S.usb ? 'CONNECTED' : 'OFF')); }), 'USB');
hot('dc', () => { S.dc = !S.dc; if (S.pwr) flash('DC 12V: ' + (S.dc ? 'EXT PWR' : 'DISC.')); }, 'DC 12V jack');

/* RF gain (top knurled knob): click +10, Shift-click −10, wheel ±5, drag left/right */
const rfb = hot('rf', needPwr(e => { if (rfb._dragged) return; S.gain = (S.gain + (e.shiftKey ? -10 : 10) + 110) % 110; if (S.gain > 100) S.gain = 0; flash('RF GAIN: ' + S.gain + '%'); }), 'RF GAIN');
rfb.addEventListener('wheel', e => { e.preventDefault(); if (!S.pwr) return; S.gain = clamp(S.gain + (e.deltaY < 0 ? 5 : -5), 0, 100); flash('RF GAIN: ' + S.gain + '%'); }, { passive: false });
{ let x0 = null; rfb.style.touchAction = 'none';
  rfb.addEventListener('pointerdown', e => { x0 = e.clientX; rfb._dragged = false; rfb.setPointerCapture(e.pointerId); });
  rfb.addEventListener('pointermove', e => { if (x0 == null || !S.pwr) return; const d = e.clientX - x0;
    if (Math.abs(d) > 6) { rfb._dragged = true; S.gain = clamp(S.gain + Math.sign(d) * 5, 0, 100); x0 = e.clientX; flash('RF GAIN: ' + S.gain + '%', 900); } });
  rfb.addEventListener('pointerup', () => { x0 = null; setTimeout(() => rfb._dragged = false, 0); }); }

/* ---------- Rotary knobs ---------- */
function makeKnob(box, label, round) {
  const k = mk('div', 'knob' + (SHOW_KNOB_MARK && round === 'tune' ? ' marked' : ''));
  crop(k, box); k.style.pointerEvents = 'auto'; k.tabIndex = 0; k.setAttribute('role', 'slider'); k.setAttribute('aria-label', label); k.title = label;
  if (round === 'tune') k.appendChild(mk('span', 'mark'));
  stage.appendChild(k); return k;
}
function bindKnob(el, onD) {
  let last = null, cx = 0, cy = 0;
  el.addEventListener('pointerdown', e => { audio(); el.setPointerCapture(e.pointerId); const r = el.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2; last = Math.atan2(e.clientY - cy, e.clientX - cx); el.style.cursor = 'grabbing'; e.preventDefault(); });
  el.addEventListener('pointermove', e => { if (last == null) return; const a = Math.atan2(e.clientY - cy, e.clientX - cx);
    let d = (a - last) * 180 / Math.PI; if (d > 180) d -= 360; if (d < -180) d += 360; last = a; onD(d); });
  const end = () => { last = null; el.style.cursor = ''; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => { e.preventDefault(); onD(e.deltaY < 0 ? 9 : -9); }, { passive: false });
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { onD(9); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { onD(-9); e.preventDefault(); } });
}
/* FREQ / TUNE */
const tuneEl = makeKnob(TUNE, 'FREQ / TUNE – drag, wheel or arrow keys', 'tune');
let tuneRot = 0, tuneAcc = 0;
function tuneStep(s) {
  if (!S.pwr) return; S.scan = false;
  if (S.field === 1) S.modeIdx = (S.modeIdx + s + 5) % 5;
  else if (S.field === 2) { S.ch = ((S.ch - 1 + s + 16) % 16) + 1; const c = chans[S.ch - 1]; S.freq = c.f; S.modeIdx = c.m; }
  else S.freq = clamp(Math.round((S.freq + s * .025) * 1000) / 1000, 136, 174);
  S.page = S.page === 1 ? 1 : S.page; beep(2000, .012, .12); render();
}
bindKnob(tuneEl, d => {
  tuneRot += d; tuneAcc += d; tuneEl.style.transform = `rotate(${tuneRot}deg)`;
  while (Math.abs(tuneAcc) >= 9) { const s = Math.sign(tuneAcc); tuneAcc -= s * 9; tuneStep(s); }
});
/* VOL */
const volEl = makeKnob(VOLK, 'VOL – drag, wheel or arrow keys', 'vol');
function setVol(a) { S.volA = clamp(a, -135, 135); volEl.style.transform = `rotate(${S.volA + 15}deg)`; if (S.pwr) { render(); } updAudio(); }
bindKnob(volEl, d => { setVol(S.volA + d); if (S.pwr) { flash('VOL: ' + Math.round((S.volA + 135) / 270 * 100) + '%', 900); } });
let volBeepT = 0; volEl.addEventListener('pointerup', () => beep(1000, .05, .3));

/* ---------- timers ---------- */
let hold = 0;
setInterval(() => {                       // RSSI simulation
  const t = performance.now();
  S.rssi = sigBase(S.freq) + (S.gain - 50) * .16 + Math.sin(t / 2300) * 1.2 + (Math.random() - .5) * 2;
  if (S.pwr && S.page !== 2) render(); else if (S.pwr) render();
  updAudio();
}, 250);
setInterval(() => {                       // scanning
  if (!S.scan || !S.pwr) return;
  if (S.rssi > -76 && hold < 3) { hold++; return; }
  hold = 0; S.ch = (S.ch % 16) + 1; const c = chans[S.ch - 1]; S.freq = c.f; S.modeIdx = c.m; beep(1800, .015, .1); render();
}, 650);
let bt = 0;
setInterval(() => {                       // battery
  bt++;
  if (S.dc && bt % 4 === 0) S.batt = Math.min(100, S.batt + 1);
  else if (!S.dc && S.pwr && bt % 40 === 0) S.batt = Math.max(1, S.batt - 1);
}, 1000);
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('dbg'); });

setVol(S.volA); render();
</script>
</body>
</html>
