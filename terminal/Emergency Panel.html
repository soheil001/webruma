#stage>*{position:absolute}
.hit{cursor:pointer;border-radius:6px;transition:background .08s,box-shadow .08s}
.key:active,.key.f{background:rgba(255,160,60,.45);box-shadow:0 0 10px rgba(255,150,40,.9)}
#screen{background:#1c0808;box-shadow:inset 0 0 12px #000;overflow:hidden;color:#ff3b3b;font-family:"Courier New",monospace;font-weight:bold;font-size:2.35cqw;line-height:1.28;text-shadow:0 0 5px #f00;padding:1.9cqw 0 0 3cqw;box-sizing:border-box;border-radius:4px}
#screen div{white-space:pre}
#sr{position:absolute;left:22cqw;top:1.9cqw}
#patch{background:#101012}
#clone{transition:transform .5s cubic-bezier(.6,0,.3,1);filter:drop-shadow(0 6px 6px #000)}
#clone.down{transform:translateY(7.9cqw)}
#lever:hover{background:rgba(255,160,60,.08)}
#cardslot{pointer-events:none;background:linear-gradient(#e8e4d4,#bdb9a6);border-radius:3px;transition:transform .4s;transform:translateX(7cqw);opacity:0;box-shadow:0 0 6px #000}

</style></head><body>
<div id="stage">
 <div id="screen"><div id="sl"></div><div id="sr"></div></div>
 <div id="patch"></div><div id="clone"></div>
 <div id="cardslot"></div>
 <div class="hit" id="lever" role="button" aria-label="Pull lever down" tabindex="0"></div>
 <div class="hit" id="card" role="button" aria-label="Insert keycard"></div>
 <div class="hit key" id="back"></div><div class="hit key" id="enter"></div>
</div>
<script>
const $=id=>document.getElementById(id),st=$('stage');
const P=(e,x,y,w,h)=>{const s=e.style;s.left=x/12+'%';s.top=y/12+'%';s.width=w/12+'%';s.height=h/12+'%'};
P($('screen'),566,337,448,170);
P($('patch'),132,442,372,170);
const cl=$('clone');P(cl,135,445,370,167);
cl.style.backgroundImage=getComputedStyle(st).backgroundImage;
cl.style.backgroundSize=(1200/370*100)+'% '+(1200/167*100)+'%';
cl.style.backgroundPosition=(135/(1200-370)*100)+'% '+(445/(1200-167)*100)+'%';
P($('lever'),130,400,380,590);
P($('card'),1050,350,115,490);
P($('cardslot'),1068,420,60,190);
P($('back'),830,880,72,36);P($('enter'),922,880,74,36);
const dir={2213:'Office',2245:'Lobby',665:'Rec',243:'C.C',9423:'Admin',23:'SS',8422:'Data',78:'Intel',221:'Security'};
let down=false,buf='',card=false,busy=false,idle=true,tmp=null,body=[];
const sl=$('sl'),sr=$('sr');
function show(a,b){sl.textContent=a;sr.textContent=b||''}
function draw(){
 if(idle){show('SYSTEM LIVE\n\nReading Info...\nData Collecting...\nScanning...','\n\nAllocating...\nContact 221');return}
 const b=tmp?[tmp]:body.slice(-3);
 show(['SYSTEM LIVE',...b,busy?'':'> '+buf+'_'].join('\n'));
}
function say(m,t=1800){tmp=m;draw();setTimeout(()=>{if(tmp===m){tmp=null;draw()}},t)}
function ready(){if(idle){idle=false;body=['Ready.']}return !busy}
const flash=e=>{e.classList.add('f');setTimeout(()=>e.classList.remove('f'),120)};
function type(c){if(!ready())return;if(buf.length<8){buf+=c;draw()}}
function back(){if(!ready())return;buf=buf.slice(0,-1);draw()}
function enter(){
 if(!ready())return;
 const n=buf.replace(/[#.]/g,''),name=dir[n];buf='';
 if(!n){say('Enter a code');return}
 if(!name){say('Invalid code');return}
 if(n==='9423'&&!card){say('Keycard required!');return}
 busy=true;body=[];
 const steps=['Reading Info...','Data Collecting...','Scanning...','Allocating...','Contact '+n+' - '+name];
 let i=0;const t=setInterval(()=>{body.push(steps[i]);draw();if(++i>=steps.length){clearInterval(t);setTimeout(()=>{busy=false;body=['Ready.'];draw()},2200)}},600);
}
function pull(){
 if(busy)return;
 down=!down;cl.classList.toggle('down',down);buf='';tmp=null;
 if(down){idle=false;body=['Booting...'];draw();setTimeout(()=>{body=['Ready.'];draw()},900)}
 else{idle=true;card=false;$('cardslot').classList.remove('in');draw()}
}
$('lever').onclick=pull;
$('lever').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pull()}};
$('card').onclick=()=>{if(!ready()&&!busy)return;card=!card;$('cardslot').classList.toggle('in',card);say(card?'Keycard accepted':'Keycard removed')};
const keys=[['1','2','3'],['4','5','6'],['7','8','9'],['#','0','.']],kx=[708,780,852],ky=[617,672,727,782];
keys.forEach((r,i)=>r.forEach((k,j)=>{const d=document.createElement('div');d.className='hit key';P(d,kx[j]-33,ky[i]-18,66,36);d.onclick=()=>type(k);d.dataset.k=k;st.appendChild(d)}));
$('back').onclick=back;$('enter').onclick=enter;
document.addEventListener('keydown',e=>{
 if(e.target===$('lever'))return;
 if(/^[0-9#.]$/.test(e.key)){type(e.key);const k=st.querySelector('[data-k="'+e.key+'"]');k&&flash(k)}
 else if(e.key==='Backspace'){back();flash($('back'))}
 else if(e.key==='Enter'){enter();flash($('enter'))}
});
draw();
</script></body></html>
