<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLLO Access Terminal</title>
<style>
  html,body{margin:0;background:#050403;min-height:100%}
  body{display:flex;justify-content:center;padding:0}
  #term{position:relative;width:100%;max-width:560px;aspect-ratio:941/1672;container-type:inline-size;
        user-select:none;-webkit-user-select:none;opacity:0;transition:opacity .25s}
  #term.ready{opacity:1}
  #term img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .key{position:absolute;padding:0;border:0;border-radius:8px;cursor:pointer;background-color:transparent;background-image:var(--img);background-repeat:no-repeat;
       touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline:0;
       transition:transform .07s ease-out,filter .07s;box-shadow:0 4px 5px rgba(0,0,0,.55)}
  .key.down{transform:translateY(2px) scale(.94);filter:brightness(.8);box-shadow:0 1px 2px rgba(0,0,0,.6)}
  .link{position:absolute;display:block;border-radius:14px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
        transition:background .1s,box-shadow .1s,transform .1s}
  .link.down{background:rgba(255,190,90,.12);box-shadow:inset 0 0 22px rgba(255,160,40,.35);transform:scale(.985)}
  .slot{position:absolute;display:none;align-items:center;justify-content:center;background:#0a0603;
        color:#ffa31a;font:700 6.2cqw "Courier New",monospace;text-shadow:0 0 8px #ff8c00,0 0 18px #ff6a00;pointer-events:none}
  .slot.bad{color:#ff2a2a;text-shadow:0 0 8px #f00,0 0 18px #c00}
  .slot.ok{color:#2eea5a;text-shadow:0 0 8px #12c93f,0 0 18px #0a9}
  #led{position:absolute;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .15s}
  @keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  #term.shake{animation:shake .4s}
</style>
</head>

<script>
const CORRECT_CODE = "123456";                 // کد صحیح
const LINKS = {
  telegram: "https://t.me/planlifeir",
  whatsapp: "https://wa.me/905437333582",
  bale:     "https://ble.ir/planlifeir"
};
const W = 941, H = 1672, S = W/941;         // مختصات پایین بر پایه‌ی عرض ۹۴۱ است
const term = document.getElementById("term"), bg = document.getElementById("bg");
const px = (el, cx, cy, w, h) => {
  cx*=S; cy*=S; w*=S; h*=S; const l = cx - w/2, t = cy - h/2;
  Object.assign(el.style, {left:l/W*100+"%", top:t/H*100+"%", width:w/W*100+"%", height:h/H*100+"%"});
  return {l, t, w, h};
};
term.style.setProperty("--img", "url(" + bg.src + ")");

// ================= صدای مرموز (WebAudio) =================
let ac, bus;
function initAudio(){
  if(ac) { if(ac.state === "suspended") ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  bus = ac.createGain(); bus.gain.value = .9; bus.connect(ac.destination);
  // ریورب ساختگی
  const len = ac.sampleRate*2.6, ir = ac.createBuffer(2, len, ac.sampleRate);
  for(let c=0;c<2;c++){ const d = ir.getChannelData(c); for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
  const conv = ac.createConvolver(); conv.buffer = ir;
  const wet = ac.createGain(); wet.gain.value = .75; bus.connect(conv); conv.connect(wet); wet.connect(ac.destination);
}
function env(g, t, a, d, v){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t+a); g.gain.exponentialRampToValueAtTime(.0001, t+a+d); }
function bell(f, d=1.6, v=.09, delay=0){
  const t = ac.currentTime+delay;
  [[1,1],[2.01,.5],[2.76,.32],[5.4,.14]].forEach(([m,a]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type="sine"; o.frequency.value = f*m*(1+(Math.random()-.5)*.004);
    env(g, t, .006, d/(m**.5), v*a); o.connect(g).connect(bus); o.start(t); o.stop(t+d+.1);
  });
}
function thud(f=95, d=.45, v=.5, delay=0){
  const t = ac.currentTime+delay, o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(34, t+d);
  env(g, t, .004, d, v); o.connect(g).connect(bus); o.start(t); o.stop(t+d+.05);
}
function whoosh(from=250, to=1400, d=.6, v=.12, delay=0){
  const t = ac.currentTime+delay, n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate*d, ac.sampleRate), x = b.getChannelData(0);
  for(let i=0;i<x.length;i++) x[i] = Math.random()*2-1;
  n.buffer = b; const f = ac.createBiquadFilter(); f.type="bandpass"; f.Q.value = 5;
  f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t+d);
  const g = ac.createGain(); env(g, t, d*.4, d*.6, v); n.connect(f).connect(g).connect(bus); n.start(t);
}
function drone(freqs, d=2.2, v=.07, type="sine", lp=900, delay=0){
  const t = ac.currentTime+delay, f = ac.createBiquadFilter(); f.type="lowpass";
  f.frequency.setValueAtTime(lp*.3, t); f.frequency.exponentialRampToValueAtTime(lp, t+d*.4);
  const g = ac.createGain(); env(g, t, d*.35, d*.65, v); f.connect(g).connect(bus);
  freqs.forEach((fr,i) => { const o = ac.createOscillator(); o.type=type; o.frequency.value = fr; o.detune.value = (i%2?7:-7);
    o.connect(f); o.start(t); o.stop(t+d+.1); });
}
const SCALE = [220,233.1,261.6,293.7,329.6,349.2,392,440,466.2,523.3];   // مقیاس فریژین تاریک
const sfx = {
  key:(k) => { const n = SCALE[+k % 10]; thud(90,.4,.45); bell(n, 1.8, .1); whoosh(200, 900, .35, .05); },
  clear:() => { whoosh(1800, 120, .8, .16); thud(70,.6,.4); },
  ok:()    => { drone([110,164.8,220,261.6], 2.8, .09, "sine", 1600); bell(880, 2.6, .1, .3); bell(1318.5, 3, .07, .55); },
  bad:()   => { drone([110,155.6], 1.5, .12, "sawtooth", 500); thud(60,.8,.6); bell(155.6, 1.4, .08, .1); },
  link:()  => { drone([73.4,110,146.8], 2.2, .1, "sine", 700); whoosh(150, 1800, .9, .14); bell(174.6, 2.4, .1, .15); thud(70,.6,.45); }
};

// ================= نمایشگر / چراغ =================
const slots = [359,418,474,529,583,637].map(x => {
  const d = document.createElement("div"); d.className = "slot"; px(d, x, 554, 44, 66); term.appendChild(d); return d;
});
const led = document.createElement("div"); led.id = "led"; px(led, 674, 744, 44, 20); term.appendChild(led);

let code = "", locked = false;
function render(state=""){
  slots.forEach((s,i) => { s.style.display = code[i] ? "flex" : "none"; s.textContent = code[i] || ""; s.className = "slot " + state; });
}
function setLed(c){ led.style.background = c; led.style.boxShadow = "0 0 14px " + c; led.style.opacity = 1; }
function reset(){ code = ""; render(); led.style.opacity = 0; locked = false; }

function press(k){
  initAudio(); if(locked) return;
  if(navigator.vibrate) navigator.vibrate(12);
  led.style.opacity = 0;
  if(k === "CLEAR"){ sfx.clear(); code = ""; render(); }
  else if(k === "ENTER"){
    if(!code){ sfx.key(0); return; }
    locked = true;
    if(code === CORRECT_CODE){ sfx.ok(); setLed("#2eea5a"); render("ok"); setTimeout(reset, 2800); }
    else { sfx.bad(); setLed("#ff2a2a"); render("bad"); term.classList.add("shake");
           setTimeout(() => term.classList.remove("shake"), 420); setTimeout(reset, 1500); }
  }
  else { sfx.key(k); if(code.length < 6){ code += k; render(); } }
}

// ================= دکمه‌های عددی =================
const cols = [316,435,552], rows = [704,791,878,967];
const labels = ["1","2","3","4","5","6","7","8","9","CLEAR","0","ENTER"];
const btns = {};
labels.forEach((k,i) => {
  const b = document.createElement("button"); b.className = "key"; b.setAttribute("aria-label", k);
  const r = px(b, cols[i%3], rows[Math.floor(i/3)], 98, 76);
  b.style.backgroundSize = (W/r.w*100) + "% " + (H/r.h*100) + "%";
  b.style.backgroundPosition = (r.l/(W-r.w)*100) + "% " + (r.t/(H-r.h)*100) + "%";
  const up = () => b.classList.remove("down");
  b.addEventListener("pointerdown", e => { e.preventDefault(); b.classList.add("down"); press(k); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, up));
  term.appendChild(b); btns[k] = b;
});

// ================= دکمه‌های خرید کد =================
[["telegram",1174],["whatsapp",1297],["bale",1420]].forEach(([name,y]) => {
  const a = document.createElement("a"); a.className = "link"; a.href = LINKS[name]; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", name); px(a, 477, y, 628, 98);
  a.addEventListener("pointerdown", () => { initAudio(); a.classList.add("down"); sfx.link(); if(navigator.vibrate) navigator.vibrate(20); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => a.addEventListener(ev, () => a.classList.remove("down")));
  term.appendChild(a);
});

addEventListener("keydown", e => {
  if(e.repeat) return;
  const k = /^[0-9]$/.test(e.key) ? e.key : e.key === "Enter" ? "ENTER" : (e.key === "Backspace" || e.key === "Escape") ? "CLEAR" : null;
  if(!k) return;
  btns[k].classList.add("down"); press(k); setTimeout(() => btns[k].classList.remove("down"), 110);
});

(bg.decode ? bg.decode() : Promise.resolve()).catch(()=>{}).then(() => term.classList.add("ready"));
</script>
