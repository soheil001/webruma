<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal</title>
<style>
:root{--bg:#0a0d14;--bar:#121722;--fg:#c9d1e0;--dim:#5b6578;--green:#7ee787;--blue:#79b8ff;--purple:#c792ea;--orange:#ffb86c;--yellow:#f1e05a;--red:#ff6b6b;--cyan:#56d4dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg)}
.term{height:100%;display:flex;flex-direction:column;background:radial-gradient(1200px 600px at 80% -10%,#16203a55,transparent),var(--bg);position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bar);border-bottom:1px solid #1e2636;user-select:none}
.dot{width:12px;height:12px;border-radius:50%}
.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.title{flex:1;text-align:center;color:var(--dim);font-size:13px;margin-right:52px}
#screen{flex:1;overflow-y:auto;padding:18px clamp(14px,3vw,36px) 40px;font-size:clamp(13px,1.5vw,15.5px);line-height:1.65;scroll-behavior:smooth}
#screen::-webkit-scrollbar{width:8px}
#screen::-webkit-scrollbar-thumb{background:#222b3d;border-radius:8px}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.65em}
.prompt{color:var(--green)}.path{color:var(--blue)}.sym{color:var(--purple)}
.out{color:var(--dim)}.ok{color:var(--green)}.warn{color:var(--yellow)}.info{color:var(--cyan)}
.code{display:flex;gap:16px;background:#0e1320;border-left:2px solid #2a3550;padding-left:12px}
.code:first-of-type{border-radius:8px 8px 0 0}
.num{color:#3a4458;min-width:2ch;text-align:right;user-select:none}
.txt{white-space:pre-wrap;word-break:break-word;flex:1}
.k{color:var(--purple)}.s{color:var(--green)}.c{color:#4b5670;font-style:italic}.n{color:var(--orange)}.f{color:var(--blue)}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--green);vertical-align:text-bottom;margin-left:1px;animation:b 1s steps(1) infinite;box-shadow:0 0 8px var(--green)}
@keyframes b{50%{opacity:0}}
.gap{height:10px}
.term::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff05 3px 4px)}
</style>
</head>
<body>
<div class="term">
  <div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><div class="title">dev@workstation: ~/my-app</div></div>
  <div id="screen"></div>
</div>
<script>
const S=document.getElementById('screen');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW='const|let|var|function|return|async|await|import|from|require|if|else|new|true|false';
const RE=new RegExp('(\\/\\/.*$)|("[^"]*"?|\'[^\']*\'?|`[^`]*`?)|\\b('+KW+')\\b|\\b(\\d+)\\b|\\b([A-Za-z_]\\w*)(?=\\()','g');
const hl=t=>esc(t).replace(RE,(m,c,s,k,n,f)=>c?`<span class="c">${c}</span>`:s?`<span class="s">${s}</span>`:k?`<span class="k">${k}</span>`:n?`<span class="n">${n}</span>`:`<span class="f">${f}</span>`);
const cur=document.createElement('span');cur.className='cur';
const down=()=>{S.scrollTop=S.scrollHeight};

const script=[
 {k:'cmd',t:'mkdir my-app && cd my-app'},
 {k:'cmd',t:'npm init -y && npm i express cors'},
 {k:'out',t:'added 64 packages in 2s',c:'ok'},
 {k:'cmd',t:'nano server.js'},
 {k:'code',t:[
  "// server.js",
  "const express = require('express');",
  "const cors = require('cors');",
  "",
  "const app = express();",
  "app.use(cors());",
  "app.use(express.json());",
  "",
  "const tasks = [];",
  "",
  "app.get('/api/tasks', (req, res) => {",
  "  res.json(tasks);",
  "});",
  "",
  "app.post('/api/tasks', (req, res) => {",
  "  const task = { id: Date.now(), title: req.body.title, done: false };",
  "  tasks.push(task);",
  "  res.status(201).json(task);",
  "});",
  "",
  "app.listen(3000, () => console.log('Server ready on :3000'));"
 ]},
 {k:'cmd',t:'node server.js'},
 {k:'out',t:'Server ready on :3000',c:'ok'},
 {k:'cmd',t:'curl -X POST localhost:3000/api/tasks -H "Content-Type: application/json" -d \'{"title":"ship it"}\''},
 {k:'out',t:'{"id":1761050400000,"title":"ship it","done":false}',c:'info'},
 {k:'cmd',t:'git add . && git commit -m "feat: tasks api"'},
 {k:'out',t:'[main 3f9a1c2] feat: tasks api\n 2 files changed, 21 insertions(+)',c:'out'},
 {k:'cmd',t:'echo "all done ✔"'},
 {k:'out',t:'all done ✔',c:'ok'}
];

function promptLine(){
  const d=document.createElement('div');d.className='ln';
  d.innerHTML='<span class="prompt">dev@workstation</span><span class="sym">:</span><span class="path">~/my-app</span><span class="sym"> $ </span>';
  const t=document.createElement('span');d.appendChild(t);S.appendChild(d);return t;
}
async function type(el,text,fn,min,max){
  el.appendChild(cur);
  for(let i=1;i<=text.length;i++){
    fn(text.slice(0,i));
    el.appendChild(cur);down();
    await sleep(min+Math.random()*(max-min));
  }
}
async function run(){
  S.innerHTML='';
  for(const it of script){
    if(it.k==='cmd'){
      const t=promptLine();
      await sleep(350);
      await type(t,it.t,v=>{t.textContent=v},28,70);
      cur.remove();await sleep(300);
    }else if(it.k==='out'){
      const d=document.createElement('div');d.className='ln '+(it.c||'out');d.textContent=it.t;
      S.appendChild(d);down();await sleep(550);
    }else{
      for(let i=0;i<it.t.length;i++){
        const d=document.createElement('div');d.className='ln code';
        d.innerHTML=`<span class="num">${i+1}</span><span class="txt"></span>`;
        const t=d.querySelector('.txt');S.appendChild(d);
        const line=it.t[i];
        if(line)await type(t,line,v=>{t.innerHTML=hl(v)},10,28);
        else{t.innerHTML=' ';await sleep(90)}
        cur.remove();down();await sleep(70);
      }
      const g=document.createElement('div');g.className='gap';S.appendChild(g);
      await sleep(600);
    }
  }
  const t=promptLine();t.appendChild(cur);down();
  await sleep(5000);
  run();
}
run();
</script>
</body>
</html>
