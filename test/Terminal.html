<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Terminal</title>
<style>
:root{--fg:#d8f5e3;--dim:#6f9a82;--green:#39ff88;--blue:#8dffc0;--purple:#2ee6a6;--orange:#b6ff6b;--cyan:#39ff88;--pink:#39ff88;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);background:linear-gradient(135deg,#000,#04140b 55%,#000);overflow:hidden;display:flex;align-items:center;justify-content:center}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 14s ease-in-out infinite}
.b1{width:46vmax;height:46vmax;background:#00c46a;top:-14vmax;left:-10vmax}
.b2{width:40vmax;height:40vmax;background:#0a8f4a;bottom:-16vmax;right:-8vmax;animation-delay:-5s}
.b3{width:30vmax;height:30vmax;background:#00ff9c;top:30%;left:45%;animation-delay:-9s;opacity:.5}
@keyframes float{50%{transform:translate(6vmax,-4vmax) scale(1.12)}}
.win{position:relative;width:min(1120px,94vw);height:min(760px,88%);display:flex;flex-direction:column;border-radius:18px;background:rgba(2,10,6,.58);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border:1px solid rgba(57,255,136,.28);box-shadow:0 30px 80px rgba(0,0,0,.75),0 0 60px rgba(57,255,136,.14),inset 0 1px 0 rgba(57,255,136,.25);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08);user-select:none}
.dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.tab{margin-left:14px;padding:5px 14px;border-radius:8px;background:rgba(255,255,255,.09);font-size:12.5px;color:var(--fg)}
.tab.off{background:none;color:var(--dim)}
#screen{flex:1;overflow-y:auto;padding:20px clamp(14px,3vw,30px);font-size:clamp(12.5px,1.4vw,15px);line-height:1.7;scroll-behavior:smooth}
#screen::-webkit-scrollbar{width:8px}
#screen::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.7em}
.pl{display:inline-block;padding:0 9px;font-size:.88em;line-height:1.5;color:#021008;font-weight:600}
.pl.a{background:var(--green);border-radius:6px 0 0 6px}
.pl.b{background:var(--blue)}
.pl.c{background:var(--purple);border-radius:0 6px 6px 0}
.sym{color:var(--pink);margin:0 6px 0 8px}
.out{color:var(--dim)}.ok{color:var(--green)}.info{color:var(--cyan)}
.code{display:flex;gap:16px;background:rgba(0,0,0,.5);padding:0 14px}
.num{color:rgba(57,255,136,.28);min-width:2ch;text-align:right;user-select:none}
.txt{white-space:pre-wrap;word-break:break-word;flex:1}
.k{color:var(--purple)}.s{color:var(--green)}.c2{color:#4f7a62;font-style:italic}.n{color:var(--orange)}.f{color:var(--blue)}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--cyan);vertical-align:text-bottom;margin-left:1px;border-radius:2px;animation:bl 1s steps(1) infinite;box-shadow:0 0 10px var(--cyan)}
@keyframes bl{50%{opacity:0}}
.gap{height:10px}
.status{display:flex;justify-content:space-between;padding:7px 16px;font-size:11.5px;color:var(--dim);background:rgba(255,255,255,.05);border-top:1px solid rgba(255,255,255,.08)}
.status b{color:var(--green);font-weight:500}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="win">
  <div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span class="tab">zsh</span><span class="tab off">server.js</span></div>
  <div id="screen"></div>
  <div class="status"><span><b>●</b> main · node v22</span><span>UTF-8 · JavaScript</span></div>
</div>
<script>
const S=document.getElementById('screen');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW='const|let|var|function|return|async|await|import|from|require|if|else|new|true|false';
const RE=new RegExp('(\\/\\/.*$)|("[^"]*"?|\'[^\']*\'?|`[^`]*`?)|\\b('+KW+')\\b|\\b(\\d+)\\b|\\b([A-Za-z_]\\w*)(?=\\()','g');
const hl=t=>esc(t).replace(RE,(m,c,s,k,n,f)=>c?`<span class="c2">${c}</span>`:s?`<span class="s">${s}</span>`:k?`<span class="k">${k}</span>`:n?`<span class="n">${n}</span>`:`<span class="f">${f}</span>`);
const cur=document.createElement('span');cur.className='cur';
const down=()=>{S.scrollTop=S.scrollHeight};

const script=[
 {k:'cmd',t:'mkdir my-app && cd my-app'},
 {k:'cmd',t:'npm init -y && npm i express cors'},
 {k:'out',t:'added 64 packages in 2s',c:'ok'},
 {k:'cmd',t:'nano server.js'},
 {k:'code',t:[
  "// server.js",
  "const express = require('express');",
  "const cors = require('cors');",
  "",
  "const app = express();",
  "app.use(cors());",
  "app.use(express.json());",
  "app.use((req, res, next) => {",
  "  console.log(`${req.method} ${req.url}`);",
  "  next();",
  "});",
  "",
  "const tasks = [];",
  "",
  "app.get('/api/tasks', (req, res) => {",
  "  res.json(tasks);",
  "});",
  "",
  "app.post('/api/tasks', (req, res) => {",
  "  const task = { id: Date.now(), title: req.body.title, done: false };",
  "  tasks.push(task);",
  "  res.status(201).json(task);",
  "});",
  "",
  "app.patch('/api/tasks/:id', (req, res) => {",
  "  const task = tasks.find(t => t.id === Number(req.params.id));",
  "  if (!task) return res.status(404).json({ error: 'Not found' });",
  "  Object.assign(task, req.body);",
  "  res.json(task);",
  "});",
  "",
  "app.delete('/api/tasks/:id', (req, res) => {",
  "  const i = tasks.findIndex(t => t.id === Number(req.params.id));",
  "  if (i === -1) return res.sendStatus(404);",
  "  tasks.splice(i, 1);",
  "  res.sendStatus(204);",
  "});",
  "",
  "function stats() {",
  "  const done = tasks.filter(t => t.done).length;",
  "  return { total: tasks.length, done, pending: tasks.length - done };",
  "}",
  "",
  "app.get('/api/stats', (req, res) => res.json(stats()));",
  "",
  "app.use((err, req, res, next) => {",
  "  console.error(err.stack);",
  "  res.status(500).json({ error: 'Something broke' });",
  "});",
  "",
  "app.listen(3000, () => console.log('Server ready on :3000'));"
 ]},
 {k:'cmd',t:'node server.js'},
 {k:'out',t:'Server ready on :3000',c:'ok'},
 {k:'cmd',t:'git add . && git commit -m "feat: tasks api"'},
 {k:'out',t:'[main 3f9a1c2] feat: tasks api\n 2 files changed, 21 insertions(+)',c:'out'},
 {k:'cmd',t:'echo "all done ✔"'},
 {k:'out',t:'all done ✔',c:'ok'}
];

function promptLine(){
  const d=document.createElement('div');d.className='ln';
  d.innerHTML='<span class="pl a">dev</span><span class="pl b">~/my-app</span><span class="pl c">main</span><span class="sym">❯</span>';
  const t=document.createElement('span');d.appendChild(t);S.appendChild(d);return t;
}
async function type(el,text,fn,min,max){
  for(let i=1;i<=text.length;i++){
    fn(text.slice(0,i));el.appendChild(cur);down();
    await sleep(min+Math.random()*(max-min));
  }
}
async function run(){
  S.innerHTML='';
  for(const it of script){
    if(it.k==='cmd'){
      const t=promptLine();t.appendChild(cur);
      await sleep(120);
      await type(t,it.t,v=>{t.textContent=v},6,18);
      cur.remove();await sleep(90);
    }else if(it.k==='out'){
      const d=document.createElement('div');d.className='ln '+(it.c||'out');d.textContent=it.t;
      S.appendChild(d);down();await sleep(160);
    }else{
      for(let i=0;i<it.t.length;i++){
        const d=document.createElement('div');d.className='ln code';
        d.innerHTML=`<span class="num">${i+1}</span><span class="txt"></span>`;
        const t=d.querySelector('.txt');S.appendChild(d);
        const line=it.t[i];
        if(line)await type(t,line,v=>{t.innerHTML=hl(v)},1,7);
        else{t.innerHTML=' ';await sleep(20)}
        cur.remove();down();await sleep(15);
      }
      S.appendChild(Object.assign(document.createElement('div'),{className:'gap'}));
      await sleep(200);
    }
  }
  const t=promptLine();t.appendChild(cur);down();
  await sleep(5000);
  run();
}
run();
</script>
</body>
</html>
